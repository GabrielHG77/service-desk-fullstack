<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MQTT Panel</title>
<style>
:root{--primary:#f2d740;--black:#0c0e0f;--secondary:#3dc2ff;--tertiary:#5260ff;--success:#2dd36f;--warning:#ffc409;--danger:#eb445a;--medium:#92949c;
  --bg:#f4f5f8;--card:#fff;--fg:#1c1c1e;--line:#d7d8da;--sub:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--black);color:#fff;border-bottom:3px solid var(--primary)}
.bar h1{font-size:18px;margin:0;font-weight:500}.sp{flex:1}
.ic{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;padding:4px 8px}
main{max-width:720px;margin:0 auto;padding:12px 16px 96px}
.btn{border:0;border-radius:4px;padding:12px 16px;font:inherit;font-weight:600;text-transform:uppercase;cursor:pointer;background:var(--primary);color:var(--black)}
.btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.btn:active{filter:brightness(.8)}.btn.gray{background:var(--medium);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}.btn.lg{padding:16px 24px;font-size:17px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 8px #0006;z-index:6}
.fld{margin:0 0 12px}.lh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:3px}
.fld label{font-size:13px;color:var(--sub)}.fld .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg)}.chk input{width:auto}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
input[type=color]{padding:2px;height:40px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.req{color:var(--danger)}
.q{border:0;border-radius:50%;width:18px;height:18px;font-size:11px;background:var(--primary);color:var(--black);cursor:pointer;padding:0}
.help{color:var(--sub);display:block;margin-top:3px}.err{white-space:pre-line;color:var(--danger);margin:8px 0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pickrow{margin:6px 0}.pickrow .help{margin:0}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.pick{background:var(--card);border-radius:8px;padding:16px;margin-bottom:8px;cursor:pointer}
.menu{position:relative;display:inline-block}.menu summary{list-style:none;cursor:pointer;padding:2px 8px;font-size:20px}.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:100%;background:var(--card);color:var(--fg);box-shadow:0 2px 8px #0005;border-radius:6px;z-index:10;min-width:150px;display:flex;flex-direction:column}
.pop button{background:none;border:0;text-align:left;padding:10px 14px;font:inherit;color:inherit;cursor:pointer}.pop .dng{color:var(--danger)}
.panels{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--card);border-radius:8px;padding:10px;position:relative;box-shadow:0 1px 3px #0003;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.panel>*{max-width:100%}.panel .menu{position:absolute;top:2px;right:2px}.pname{font-weight:600;font-size:14px;margin-right:24px}
.pb{min-width:90px}.pb[aria-pressed=true]{box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--black)}.grp{display:flex;flex-wrap:wrap;gap:8px;width:100%}.grp .btn{flex:1 1 90px}
.empty{text-align:center;padding:48px 0;color:var(--sub)}
.st{border:0;border-radius:12px;padding:3px 10px;font:12px system-ui;cursor:pointer;color:#fff;background:var(--medium)}.st.connected{background:var(--success)}.st.connecting{background:var(--warning)}.st.error{background:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:#000d;color:#fff;padding:8px 14px;border-radius:20px;z-index:50}
.tabs{display:flex;margin:0 0 12px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 0;font:inherit;font-weight:600;text-transform:uppercase;color:var(--sub);cursor:pointer}
.tabs .on{color:var(--fg);border-bottom-color:var(--primary)}
.box{margin-bottom:8px;align-items:stretch}.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}.box .row2{margin:0}
.pill{border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--medium);color:#fff}
.pill.ready,.pill.running{background:var(--success)}.pill.online{background:var(--warning);color:var(--black)}.pill.offline{background:var(--danger)}
.feed{margin-top:12px}.feed summary{cursor:pointer;color:var(--sub)}.feed pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
const uid=()=>Math.random().toString(36).slice(2,10);
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,Math.max(2500,m.length*70))};
const COL={primary:'#f2d740',secondary:'#3dc2ff',tertiary:'#5260ff',success:'#2dd36f',warning:'#ffc409',danger:'#eb445a',medium:'#92949c'};
const COLS=Object.keys(COL).map(k=>[k,k[0].toUpperCase()+k.slice(1)]);
const fill=c=>{const k=COL[c]?c:'primary';return `background:${COL[k]};color:${k==='primary'||k==='warning'?'#0c0e0f':'#fff'}`};   // white text is unreadable on the two yellows

/* ---------- storage (ponytail: password in plain localStorage; fine for personal use, encrypt if the device is shared) ---------- */
const KEY='mqtt-buttons-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db=db&&Array.isArray(db.panels)?db:{conn:null,panels:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Could not save (storage blocked)')}};

/* ---------- MQTT ---------- */
const BRIDGE=false;   // the Windows program serves this page with true: it relays Websocket <-> plain TCP, so the broker's normal port 1883 works
let client=null,status='disconnected',off=false;
const setStatus=s=>{status=s;const e=$('#st');if(e){e.className='st '+s;e.textContent=s}touch()};
// what the boards say about themselves (MCP PLAY manual 18.6): <name>/discovery (JSON, published once at boot and kept by the broker, so it can be gone), <name>/status (offline, online, ready, running)
// and <name>/network/ip, the live answer to <name>/network/ip/get (18.6.4), which is where the IP comes from when discovery is missing
const SUBS=['+/discovery','+/status','+/network/ip','$SYS/broker/clients/connected','$SYS/broker/version'];
const boards=new Map(),feed=[];let sys={},denied=[],dirty=false;
const touch=()=>{if(dirty)return;dirty=true;requestAnimationFrame(()=>{dirty=false;if(route.n==='status')draw()})};   // one redraw per frame, retained messages arrive in bursts
function onMsg(t,m,stored){   // stored: the broker replays a retained message = the board spoke once, not proof it is there now. Only a live message or an answer makes a board "live"
  feed.unshift({t,m,at:Date.now(),stored});feed.length=Math.min(feed.length,20);
  let x;const dev=id=>{if(!boards.has(id))boards.set(id,{id});const b=boards.get(id);if(!stored)b.live=true;return b};
  if(t==='$SYS/broker/clients/connected')sys.clients=m;
  else if(t==='$SYS/broker/version')sys.version=m;
  else if(x=/^(.+)\/discovery$/.exec(t)){try{const d=JSON.parse(m),b=dev(x[1]);Object.assign(b,{host:d.hostname,mac:d.mac,sw:d.swAppVersion});if(d.ip&&!b.ipLive)b.ip=d.ip}catch{}}   // the board's own answer beats the boot-time IP
  else if(x=/^(.+)\/network\/ip$/.exec(t)){const ip=m.trim().replace(/^"|"$/g,'');if(/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)){const b=dev(x[1]);b.ip=ip;if(!stored)b.ipLive=true}}
  else if(x=/^(.+)\/status$/.exec(t)){const b=Object.assign(dev(x[1]),{state:m.trim().toLowerCase()});if(!stored)b.at=Date.now()}
  touch()}
function hangup(){if(client){const c=client;client=null;c.end(true)}setStatus('disconnected')}
function connect(){
  hangup();off=false;boards.clear();feed.length=0;sys={};denied=[];const c=db.conn;
  if(typeof mqtt==='undefined'){setStatus('error');return toast('MQTT library failed to load (check internet)')}
  setStatus('connecting');let cl;
  const url=c.protocol==='tcp'?`ws://${location.host}/tcp/${c.host}/${c.port}`:`${c.protocol==='wss'?'wss':'ws'}://${c.host}:${c.port}/${String(c.path||'mqtt').replace(/^\/+/,'')}`;
  try{cl=client=mqtt.connect(url,
    {clientId:rid(),username:c.username||undefined,password:c.password||undefined,reconnectPeriod:3000,connectTimeout:20000,resubscribe:false})}
  catch(e){setStatus('error');return toast(e.message)}
  let opened=false,told=false;   // told: explain a failed attempt once, not on every 3s retry
  cl.on('connect',()=>{if(cl===client){opened=true;setStatus('connected');denied=[];
      SUBS.forEach(t=>cl.subscribe(t,e=>{if(cl===client&&/^Subscribe error/.test(e?.message)){denied.push(t);touch()}}));   // one by one: for a refusal mqtt.js does not say which filter
      setTimeout(()=>{if(cl===client&&cl.connected)ask()},1500)}})   // the broker's stored messages are in by now: ask each board, only an answer proves it is there
    .on('message',(t,m,pk)=>cl===client&&onMsg(t,String(m),pk.retain))
    .on('reconnect',()=>cl===client&&setStatus('connecting'))
    .on('close',()=>{if(cl!==client)return;setStatus('disconnected');
      if(!opened&&!told){told=true;toast(c.protocol==='tcp'?'Could not connect. Check the address and port, and that this PC can reach the broker.':/^(1883|8883)$/.test(String(c.port))?"Port 1883/8883 is plain MQTT (TCP), which browsers can't use. Use your broker's Websocket port.":'Could not connect. Check the address, the Websocket port and that the broker is reachable.')}})
    .on('error',e=>{if(cl===client){told=true;setStatus('error');toast(e.message)}})}
function send(p,payload){   // true when the message went out (a toggle button only flips when it did)
  const pl=String(payload);
  if(p.confirm&&!confirm((p.confirmMsg||'<payload>').replaceAll('<payload>',pl)))return false;
  if(!client?.connected){toast('Not connected');return false}
  const m=p.isJson&&p.jsonEnv&&pl!==''?p.jsonEnv.replaceAll('<payload>',pl):pl;
  client.publish(p.topic,m,{qos:+p.qos||0,retain:!!p.retain},e=>toast(e?'Error: '+e.message:`Sent ${p.topic} ← ${m}`));return true}

/* ---------- generic form builder ---------- */
const T=(k,label,o={})=>({k,label,...o}),N=(k,label,o={})=>T(k,label,{type:'number',...o}),C=(k,label,o={})=>T(k,label,{type:'check',...o}),
  S=(k,label,opts,o={})=>T(k,label,{type:'select',opts,...o});
function defaults(spec,o={}){for(const f of spec){if(f.row)defaults(f.row,o);else if('def'in f&&!(f.k in o))o[f.k]=structuredClone(f.def)}return o}
let fid=0;
function leaf(f,v,change){
  const id='f'+(++fid),el=h('div',{class:'fld'}),help=f.help&&h('small',{class:'help',hidden:true},f.help);
  const qm=f.help&&h('button',{type:'button',class:'q','aria-label':'Help',onclick:()=>{help.hidden=!help.hidden}},'?');
  const add=(...k)=>el.append(...k.filter(Boolean));let subs=[];
  if(f.type==='check'){
    const i=h('input',{type:'checkbox',id,checked:!!v[f.k]});i.onchange=()=>{v[f.k]=i.checked;change()};
    add(h('div',{class:'lh'},h('label',{class:'chk',for:id},i,f.label),qm),help)
  }else if(f.type==='pick'){
    const opts=f.src(v);
    add(h('div',{class:'lh'},f.label),...(opts.length?opts.map(o=>{const i=h('input',{type:'checkbox',id:id+o.id,checked:v[f.k].includes(o.id)});
      i.onchange=()=>{v[f.k]=i.checked?[...v[f.k],o.id]:v[f.k].filter(x=>x!==o.id);change()};
      return h('label',{class:'chk pickrow',for:id+o.id},i,h('span',{},o.name,h('small',{class:'help'},`${o.topic} ← ${o.toggle?o.payload+' / '+o.payloadOff:o.noPayload?'(empty)':o.payload}`)))})
      :[h('small',{class:'help'},'No buttons yet. Create buttons first, then group them here.')]))
  }else if(f.type==='list'){
    const box=h('div');
    const draw=()=>{subs=[];box.replaceChildren(...v[f.k].map((it,i)=>{const s=fields(f.of,it,change);subs.push(s);s.sync();
      return h('div',{class:'item'},s.nodes,h('button',{type:'button',class:'btn gray sm',onclick:()=>{v[f.k].splice(i,1);draw();change()}},f.delLabel))}),
      h('button',{type:'button',class:'btn sm',onclick:()=>{v[f.k].push(defaults(f.of));draw();change()}},f.addLabel))};
    draw();add(h('div',{class:'lh'},f.label),box)
  }else{
    let i;
    if(f.type==='select'){i=h('select',{id},f.opts.map(([val,l])=>h('option',{value:val,selected:String(val)===String(v[f.k])},l)));
      i.onchange=()=>{v[f.k]=f.opts.find(o=>String(o[0])===i.value)[0];change()}}
    else{i=h('input',{id,type:f.type||'text',value:v[f.k]??'',step:f.type==='number'?'any':null,autocomplete:f.type==='password'?'current-password':'off'});
      i.oninput=()=>{v[f.k]=f.type==='number'?(i.value===''?'':+i.value):i.value;change()}}
    add(h('div',{class:'lh'},h('label',{for:id},f.label,f.req&&h('span',{class:'req'},' *')),qm),help,i)
  }
  return{el,sync:()=>{el.hidden=!!f.show&&!f.show(v)},
    check:()=>{if(f.show&&!f.show(v))return[];const x=v[f.k],e=[];
      if(f.req&&(x===''||x==null||(f.type==='list'&&!x.length)))e.push(f.err||`${f.label} is required`);
      else if(f.val){const m=f.val(x,v);if(m)e.push(m)}
      return[...e,...subs.flatMap(s=>s.check())]}}
}
function fields(spec,v,change){
  const kids=[];
  const nodes=spec.map(f=>{
    if(f.row){const s=fields(f.row,v,change);kids.push(s);return h('div',{class:'row'},s.nodes)}
    const L=leaf(f,v,change);kids.push(L);return L.el});
  return{nodes,check:()=>kids.flatMap(k=>k.check()),sync:()=>kids.forEach(k=>k.sync())}}
function Form(spec,v,{save:onSave,cancel,label}){
  const b=fields(spec,v,()=>b.sync()),err=h('div',{class:'err'});
  const f=h('form',{novalidate:true,onsubmit:e=>{e.preventDefault();const es=b.check();
    err.textContent=es.length?'Fix above error(s) first\n'+es.join('\n'):'';if(!es.length)onSave(v)}},
    b.nodes,err,h('div',{class:'btns'},h('button',{type:'button',class:'btn gray',onclick:cancel},'Cancel'),h('button',{class:'btn'},label)));
  b.sync();return f}

/* ---------- navigation / chrome ---------- */
const stack=[];let route={n:'home'};
const go=r=>{stack.push(route);route=r;render()},back=()=>{route=stack.pop()||{n:'home'};render()};
const menu=items=>h('details',{class:'menu'},h('summary',{'aria-label':'Menu'},'⋮'),
  h('div',{class:'pop'},items.map(i=>h('button',{type:'button',class:i.danger?'dng':'',onclick:e=>{e.target.closest('details').open=false;i.fn()}},i.label))));
document.addEventListener('click',e=>document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false}));
const bar=(title,{back:b=true,right}={})=>h('header',{class:'bar'},
  b?h('button',{class:'ic','aria-label':'Back',onclick:()=>back()},'←'):null,h('h1',{},title),h('span',{class:'sp'}),right);
const page=(title,body)=>h('div',{},bar(title),h('main',{},body));

/* ---------- forms ---------- */
const CONN=[
  T('host','Broker address',{req:1,err:'Broker host address is required',help:'DNS/IP address of MQTT broker. e.g. test.mosquitto.org or 192.168.1.5',val:x=>/^[\w.-]+$/.test(x)?null:'Invalid host address'}),
  {row:[N('port','Port',{req:1,def:BRIDGE?1883:8080,err:'Port number is required',val:x=>x>=1&&x<=65535?null:'Invalid port'}),
    S('protocol','Network protocol',[...(BRIDGE?[['tcp','MQTT (TCP)']]:[]),['ws','Websocket'],['wss','Websocket-SSL']],{def:BRIDGE?'tcp':'ws',
      help:BRIDGE?'MQTT (TCP) is the broker\'s normal port, usually 1883. Websocket needs a broker with a websocket port.':'Browsers only speak MQTT over Websocket. Use the broker\'s websocket port. On an https page use Websocket-SSL.'})]},
  T('path','Path',{def:'/mqtt',show:v=>v.protocol!=='tcp',help:'Websocket path of the broker, usually /mqtt'}),
  {row:[T('username','Username'),T('password','Password',{type:'password'})]}];
const noWild=x=>/[+#]/.test(x)?'Wildcards are not allowed':null;
const NAME=T('name','Panel name',{req:1}),TOPIC=T('topic','Topic',{req:1,val:noWild});
const WIDTHS=[[100,'Full screen'],[75,'3/4 screen width'],[66,'2/3 screen width'],[50,'1/2 screen width'],[33,'1/3 screen width'],[25,'1/4 screen width']];
const COLOR=S('color','Button color',COLS,{def:'primary'}),SIZE=S('size','Button size',[['small','Small'],['medium','Medium'],['large','Large']],{def:'medium'});
const QR=[{row:[S('qos','QoS',[[0,'0'],[1,'1'],[2,'2']],{def:0}),C('retain','Retain')]},C('confirm','Confirm before publish'),
  T('confirmMsg','Confirmation message',{def:'<payload>',show:v=>v.confirm})];
const JSN=[C('isJson','Payload is JSON Data'),T('jsonEnv','JSON pattern for publish',{show:v=>v.isJson,help:'Wrap published messages in JSON. Use <payload> where the value goes, e.g. {"state":"<payload>"}'})];
const TAIL=[C('hideName','Hide label'),S('width','Panel Width',WIDTHS,{def:100})];
const sz=p=>p.size==='large'?' lg':p.size==='small'?' sm':'';
const tog=new Map();   // toggle buttons: on or off as this page last sent it, by panel id. shortcut: not read back from the board and forgotten on reload
const PT={
  button:{label:'Button',fields:[NAME,TOPIC,T('payload','Payload',{req:1,err:'Payload is required',show:v=>!v.noPayload}),C('noPayload','No payload'),
    C('toggle','Toggle: press again to send a second payload',{help:'The first press sends the payload, the next press sends the second payload, and so on. For a motor: payload 30 (speed), second payload 0 (stop). It replaces the hold options (second payload on release, repeat).'}),
    T('payloadOff','Payload on the second press',{req:1,err:'The second payload is required',show:v=>v.toggle}),
    T('payloadRel','Separate payload on release',{help:'Publish a second payload when the button is released'}),C('repeat','Repeat publish until released'),
    N('repInt','Repeat interval in milliseconds',{def:1000,show:v=>v.repeat,req:1,err:'Repeat interval is required',val:x=>x>=100&&x<=10000?null:'100-10000 allowed'}),
    COLOR,SIZE,C('fit','Fit to panel width'),...QR,...JSN,...TAIL],
    body(p){const b=h('button',{class:'btn pb'+sz(p),style:`${fill(p.color)}${p.fit?';width:100%':''}`},p.name),pl=()=>p.noPayload?'':p.payload;
      if(p.toggle){const paint=()=>{const on=!!tog.get(p.id);b.textContent=on?p.name+' · ON':p.name;b.setAttribute('aria-pressed',on)};
        b.onclick=()=>{const on=!tog.get(p.id);if(send(p,on?pl():p.payloadOff)){tog.set(p.id,on);paint()}};paint()}
      else if((p.repeat||p.payloadRel)&&!p.confirm){let tm,down=false;   // hold behaviour needs pointer events; plain taps use click (keyboard friendly)
        const up=()=>{if(!down)return;down=false;clearInterval(tm);if(p.payloadRel)send(p,p.payloadRel)};
        b.style.touchAction='none';b.oncontextmenu=e=>e.preventDefault();
        b.onpointerdown=()=>{down=true;send(p,pl());if(p.repeat)tm=setInterval(()=>send(p,pl()),+p.repInt||1000)};
        b.onpointerup=b.onpointerleave=b.onpointercancel=up}
      else b.onclick=()=>send(p,pl());
      return b}},
  group:{label:'Button group',fields:[NAME,
    T('members','Existing buttons',{type:'pick',def:[],
      src:v=>db.panels.filter(b=>b.type==='button'&&!db.panels.some(g=>g.id!==v.id&&g.members?.includes(b.id))),
      val:(x,v)=>x.length||v.items?.length?null:'Select at least one button'}),...TAIL],
    // each member keeps its own topic, payload, colour and options; p.items only exists on groups saved by older versions
    body:p=>h('div',{class:'grp'},db.panels.filter(b=>b.type==='button'&&p.members?.includes(b.id)).map(b=>PT.button.body(b)),
      (p.items||[]).map(it=>h('button',{class:'btn'+sz(p),style:fill(p.color),onclick:()=>send(p,it.payload)},it.label)))}
};

/* ---------- views ---------- */
const visible=()=>{const g=new Set(db.panels.flatMap(x=>x.members||[]));return db.panels.filter(p=>!g.has(p.id))};
function card(p,i,vis){
  const mv=k=>{const o=vis[i+k];if(!o)return;const a=db.panels.indexOf(p),b=db.panels.indexOf(o);[db.panels[a],db.panels[b]]=[db.panels[b],db.panels[a]];save();render()},w=+p.width||100;
  const mem=p.type==='group'?db.panels.filter(b=>p.members?.includes(b.id)):[];
  return h('section',{class:'panel',style:`width:calc(${w}% - ${8*(1-w/100)}px)`},
    menu([{label:'Edit',fn:()=>go({n:'panel',pid:p.id})},...mem.map(b=>({label:`Edit "${b.name}"`,fn:()=>go({n:'panel',pid:b.id})})),
      {label:'Move before',fn:()=>mv(-1)},{label:'Move after',fn:()=>mv(1)},
      {label:'Delete',danger:1,fn:()=>{if(confirm(`Delete "${p.name}"?`)){db.panels=db.panels.filter(x=>x!==p);db.panels.forEach(g=>{if(g.members)g.members=g.members.filter(id=>id!==p.id)});save();render()}}}]),
    p.hideName?null:h('div',{class:'pname'},p.name),PT[p.type].body(p))}
const add=()=>go({n:'pick'});
const tabs=cur=>h('nav',{class:'tabs'},[['home','Buttons'],['status','Status']].map(([n,l])=>
  h('button',{type:'button',class:n===cur?'on':'','aria-current':n===cur?'page':null,onclick:()=>{if(n!==cur){route={n};render()}}},l)));
function ask(){   // the manual: an empty message on <name>/status/get (18.6.7) makes a board repeat its state, no answer within 2 s means it is probably offline; on <name>/network/ip/get (18.6.4) it answers its IP on <name>/network/ip. Never <name>/network/ip/set: that changes the IP
  if(!client?.connected)return toast('Not connected');
  const t=Date.now();boards.forEach(b=>{b.asked=t;client.publish(b.id+'/status/get','');client.publish(b.id+'/network/ip/get','')});
  draw();setTimeout(()=>route.n==='status'&&draw(),2600)}
function draw(){
  const body=$('#stbody');if(!body||!db.conn)return;
  const at=t=>new Date(t).toLocaleTimeString(),all=[...boards.values()].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})),
    list=all.filter(b=>b.live),stored=all.filter(b=>!b.live),
    card=b=>h('section',{class:'panel box'},
      h('div',{class:'row2'},h('b',{},b.id),h('span',{class:'pill '+(b.state||'')},b.state||'no status')),
      h('div',{},b.ip||'IP unknown'),h('small',{class:'help'},[b.host,b.mac,b.sw].filter(Boolean).join(' · ')),
      b.at?h('small',{class:'help'},'status at '+at(b.at)):null,
      b.asked&&Date.now()-b.asked>2500&&(b.at||0)<b.asked?h('small',{class:'err'},'No answer to the status request, probably offline'):null,
      b.asked&&Date.now()-b.asked>2500&&!b.ip?h('small',{class:'err'},`No IP yet: nothing came back on ${b.id}/network/ip`):null);
  body.replaceChildren(...[
    h('section',{class:'panel box'},h('div',{class:'row2'},h('b',{},`${db.conn.host}:${db.conn.port}`),h('span',{class:'st '+status},status)),
      h('small',{class:'help'},sys.clients?`${sys.clients} clients connected to the broker${sys.version?' · '+sys.version:''}`:'The broker has not said how many clients are connected')),
    status!=='connected'&&h('div',{class:'err'},'Not connected.'+(all.length?' Showing the last data received.':'')),
    denied.length&&h('div',{class:'err'},'The broker does not let this app listen to: '+denied.join(', ')),
    h('div',{class:'row2'},h('b',{},`Devices (${list.length})`),h('button',{class:'btn sm',onclick:ask},'Refresh')),
    ...(list.length?list.map(card):[h('div',{class:'empty'},h('p',{},'No board has answered yet'),h('small',{class:'help'},'A board is listed here only after it publishes on <name>/status or answers Refresh. If nothing shows up, no board is talking to this broker, or this app is not allowed to listen.'))])
  ].filter(Boolean));
  $('#stored').hidden=!stored.length;$('#storedsum').textContent=`Stored in the broker, no answer (${stored.length})`;   // what the broker remembers from boards that did not answer: possibly switched off or renamed
  $('#storedlist').textContent=stored.map(b=>[b.id,b.ip||'IP unknown',b.state&&'last state: '+b.state].filter(Boolean).join(' · ')).join('\n');
  $('#feed').textContent=feed.map(f=>`${at(f.at)}  ${f.t}  ${f.m.slice(0,160)}${f.stored?'  (stored in the broker)':''}`).join('\n')||'(nothing yet)'}
const views={
home(){
  if(db.conn&&!client&&!off)connect();
  const chip=db.conn&&h('button',{id:'st',class:'st '+status,onclick:()=>{if(client){off=true;hangup()}else connect()}},status);
  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},db.conn&&tabs('home'),!db.conn?h('div',{class:'empty'},h('p',{},'Connect to your MQTT broker first'),h('button',{class:'btn',onclick:()=>go({n:'conn'})},'Setup a connection'))
      :db.panels.length?h('div',{class:'panels'},visible().map((p,i,vis)=>card(p,i,vis)))
      :h('div',{class:'empty'},h('p',{},'No buttons yet'),h('button',{class:'btn',onclick:add},'Add a button')),
      db.conn&&db.panels.length?h('button',{class:'btn fab','aria-label':'Add',onclick:add},'+'):null))},
status(){
  if(db.conn&&!client&&!off)connect();
  const chip=db.conn&&h('button',{id:'st',class:'st '+status,onclick:()=>{if(client){off=true;hangup()}else connect()}},status);
  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},tabs('status'),h('div',{id:'stbody'}),
      h('details',{class:'feed',id:'stored',hidden:true},h('summary',{id:'storedsum'}),h('pre',{id:'storedlist'})),
      h('details',{class:'feed'},h('summary',{},'Messages received'),h('pre',{id:'feed'}))))},
conn(){
  const v=db.conn?structuredClone(db.conn):defaults(CONN,{host:location.protocol==='http:'&&!BRIDGE?location.hostname:''});   // served by the broker's http_dir: same host
  return page(db.conn?'Edit Connection':'Add Connection',Form(CONN,v,{label:db.conn?'SAVE':'CREATE',cancel:()=>back(),save:x=>{db.conn=x;save();connect();back()}}))},
pick(){return page('Select panel type to add',Object.entries(PT).map(([k,t])=>h('div',{class:'pick',tabindex:0,role:'button',onclick:()=>go({n:'panel',type:k,pick:1})},h('b',{},t.label))))},
panel({pid,type,pick}){
  const ex=pid&&db.panels.find(p=>p.id===pid),t=PT[ex?ex.type:type],v=ex?structuredClone(ex):defaults(t.fields,{id:uid(),type});
  return page((ex?'Edit ':'Add ')+t.label,Form(t.fields,v,{label:ex?'SAVE':'CREATE',cancel:()=>{if(pick)stack.pop();back()},
    save:x=>{const i=db.panels.findIndex(p=>p.id===x.id);i<0?db.panels.push(x):db.panels[i]=x;save();if(pick)stack.pop();back()}}))}
};
function render(){$('#app').replaceChildren(views[route.n](route));window.scrollTo(0,0);if(route.n==='status')draw()}
render();
</script>
</body>
</html>
