<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MQTT Panel</title>
<style>
:root{--primary:#3880ff;--secondary:#3dc2ff;--tertiary:#5260ff;--success:#2dd36f;--warning:#ffc409;--danger:#eb445a;--medium:#92949c;
  --bg:#f4f5f8;--card:#fff;--fg:#1c1c1e;--line:#d7d8da;--sub:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary);color:#fff}
.bar h1{font-size:18px;margin:0;font-weight:500}.sp{flex:1}
.ic{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;padding:4px 8px}
main{max-width:720px;margin:0 auto;padding:12px 16px 96px}
.btn{border:0;border-radius:4px;padding:12px 16px;font:inherit;font-weight:600;text-transform:uppercase;cursor:pointer;background:var(--primary);color:#fff}
.btn:active{filter:brightness(.8)}.btn.gray{background:var(--medium)}.btn.red{background:var(--danger)}.btn.sm{padding:5px 10px;font-size:12px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 8px #0006;z-index:6}
.fld{margin:0 0 12px}.lh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:3px}
.fld label{font-size:13px;color:var(--sub)}.fld .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg)}.chk input{width:auto}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);font:inherit}
input[type=color]{padding:2px;height:40px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.req{color:var(--danger)}
.q{border:0;border-radius:50%;width:18px;height:18px;font-size:11px;background:var(--primary);color:#fff;cursor:pointer;padding:0}
.help{color:var(--sub);display:block;margin-top:3px}.err{white-space:pre-line;color:var(--danger);margin:8px 0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.pick{background:var(--card);border-radius:8px;padding:16px;margin-bottom:8px;cursor:pointer}
.menu{position:relative;display:inline-block}.menu summary{list-style:none;cursor:pointer;padding:2px 8px;font-size:20px}.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:100%;background:var(--card);color:var(--fg);box-shadow:0 2px 8px #0005;border-radius:6px;z-index:10;min-width:150px;display:flex;flex-direction:column}
.pop button{background:none;border:0;text-align:left;padding:10px 14px;font:inherit;color:inherit;cursor:pointer}.pop .dng{color:var(--danger)}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.panel{background:var(--card);border-radius:8px;padding:8px;box-shadow:0 1px 3px #0003;display:flex;align-items:center;gap:4px}
.panel .pb{flex:1;min-width:0;padding:18px 8px}.panel.wide{grid-column:1/-1;flex-direction:column;align-items:stretch}
.head{display:flex;align-items:center;justify-content:space-between;padding-left:4px}
.grp{display:flex;flex-wrap:wrap;gap:8px}.grp .btn{flex:1 1 90px}
.empty{text-align:center;padding:48px 0;color:var(--sub)}
.st{border:0;border-radius:12px;padding:3px 10px;font:12px system-ui;cursor:pointer;color:#fff;background:var(--medium)}.st.connected{background:var(--success)}.st.connecting{background:var(--warning)}.st.error{background:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:#000d;color:#fff;padding:8px 14px;border-radius:20px;z-index:50}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
const uid=()=>Math.random().toString(36).slice(2,10);
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2500)};
const COL={primary:'#3880ff',secondary:'#3dc2ff',tertiary:'#5260ff',success:'#2dd36f',warning:'#ffc409',danger:'#eb445a',medium:'#92949c'};
const COLS=Object.keys(COL).map(k=>[k,k[0].toUpperCase()+k.slice(1)]);
const cv=c=>COL[c]||COL.primary;

/* ---------- storage (ponytail: password in plain localStorage; fine for personal use, encrypt if the device is shared) ---------- */
const KEY='mqtt-buttons-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db=db&&Array.isArray(db.panels)?db:{conn:null,panels:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Could not save (storage blocked)')}};

/* ---------- MQTT ---------- */
let client=null,status='disconnected',off=false;
const setStatus=s=>{status=s;const e=$('#st');if(e){e.className='st '+s;e.textContent=s}};
function hangup(){if(client){const c=client;client=null;c.end(true)}setStatus('disconnected')}
function connect(){
  hangup();off=false;const c=db.conn;
  if(typeof mqtt==='undefined'){setStatus('error');return toast('MQTT library failed to load (check internet)')}
  setStatus('connecting');let cl;
  try{cl=client=mqtt.connect(`${c.protocol==='wss'?'wss':'ws'}://${c.host}:${c.port}/${String(c.path||'mqtt').replace(/^\/+/,'')}`,
    {clientId:rid(),username:c.username||undefined,password:c.password||undefined,reconnectPeriod:3000,connectTimeout:20000})}
  catch(e){setStatus('error');return toast(e.message)}
  cl.on('connect',()=>cl===client&&setStatus('connected'))
    .on('reconnect',()=>cl===client&&setStatus('connecting'))
    .on('close',()=>cl===client&&setStatus('disconnected'))
    .on('error',e=>{if(cl===client){setStatus('error');toast(e.message)}})}
function send(p,payload){
  if(!client?.connected)return toast('Not connected');
  client.publish(p.topic,String(payload),{qos:+p.qos||0,retain:!!p.retain},e=>toast(e?'Error: '+e.message:`Sent ${p.topic} ← ${payload}`))}

/* ---------- generic form builder ---------- */
const T=(k,label,o={})=>({k,label,...o}),N=(k,label,o={})=>T(k,label,{type:'number',...o}),C=(k,label,o={})=>T(k,label,{type:'check',...o}),
  S=(k,label,opts,o={})=>T(k,label,{type:'select',opts,...o});
function defaults(spec,o={}){for(const f of spec){if(f.row)defaults(f.row,o);else if('def'in f&&!(f.k in o))o[f.k]=structuredClone(f.def)}return o}
let fid=0;
function leaf(f,v){
  const id='f'+(++fid),el=h('div',{class:'fld'}),help=f.help&&h('small',{class:'help',hidden:true},f.help);
  const qm=f.help&&h('button',{type:'button',class:'q','aria-label':'Help',onclick:()=>{help.hidden=!help.hidden}},'?');
  const add=(...k)=>el.append(...k.filter(Boolean));let subs=[];
  if(f.type==='check'){
    const i=h('input',{type:'checkbox',id,checked:!!v[f.k]});i.onchange=()=>{v[f.k]=i.checked};
    add(h('label',{class:'chk',for:id},i,f.label))
  }else if(f.type==='list'){
    const box=h('div');
    const draw=()=>{subs=[];box.replaceChildren(...v[f.k].map((it,i)=>{const s=fields(f.of,it);subs.push(s);
      return h('div',{class:'item'},s.nodes,h('button',{type:'button',class:'btn gray sm',onclick:()=>{v[f.k].splice(i,1);draw()}},f.delLabel))}),
      h('button',{type:'button',class:'btn sm',onclick:()=>{v[f.k].push(defaults(f.of));draw()}},f.addLabel))};
    draw();add(h('div',{class:'lh'},f.label),box)
  }else{
    let i;
    if(f.type==='select'){i=h('select',{id},f.opts.map(([val,l])=>h('option',{value:val,selected:String(val)===String(v[f.k])},l)));
      i.onchange=()=>{v[f.k]=f.opts.find(o=>String(o[0])===i.value)[0]}}
    else{i=h('input',{id,type:f.type||'text',value:v[f.k]??'',step:f.type==='number'?'any':null,autocomplete:f.type==='password'?'current-password':'off'});
      i.oninput=()=>{v[f.k]=f.type==='number'?(i.value===''?'':+i.value):i.value}}
    add(h('div',{class:'lh'},h('label',{for:id},f.label,f.req&&h('span',{class:'req'},' *')),qm),help,i)
  }
  return{el,check:()=>{const x=v[f.k],e=[];
    if(f.req&&(x===''||x==null||(f.type==='list'&&!x.length)))e.push(f.err||`${f.label} is required`);
    else if(f.val){const m=f.val(x,v);if(m)e.push(m)}
    return[...e,...subs.flatMap(s=>s.check())]}}
}
function fields(spec,v){
  const kids=[];
  const nodes=spec.map(f=>{
    if(f.row){const s=fields(f.row,v);kids.push(s);return h('div',{class:'row'},s.nodes)}
    const L=leaf(f,v);kids.push(L);return L.el});
  return{nodes,check:()=>kids.flatMap(k=>k.check())}}
function Form(spec,v,{save:onSave,cancel,label}){
  const b=fields(spec,v),err=h('div',{class:'err'});
  return h('form',{novalidate:true,onsubmit:e=>{e.preventDefault();const es=b.check();
    err.textContent=es.length?'Fix above error(s) first\n'+es.join('\n'):'';if(!es.length)onSave(v)}},
    b.nodes,err,h('div',{class:'btns'},h('button',{type:'button',class:'btn gray',onclick:cancel},'Cancel'),h('button',{class:'btn'},label)))}

/* ---------- navigation / chrome ---------- */
const stack=[];let route={n:'home'};
const go=r=>{stack.push(route);route=r;render()},back=()=>{route=stack.pop()||{n:'home'};render()};
const menu=items=>h('details',{class:'menu'},h('summary',{'aria-label':'Menu'},'⋮'),
  h('div',{class:'pop'},items.map(i=>h('button',{type:'button',class:i.danger?'dng':'',onclick:e=>{e.target.closest('details').open=false;i.fn()}},i.label))));
document.addEventListener('click',e=>document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false}));
const bar=(title,{back:b=true,right}={})=>h('header',{class:'bar'},
  b?h('button',{class:'ic','aria-label':'Back',onclick:()=>back()},'←'):null,h('h1',{},title),h('span',{class:'sp'}),right);
const page=(title,body)=>h('div',{},bar(title),h('main',{},body));

/* ---------- forms ---------- */
const CONN=[
  T('host','Broker address',{req:1,err:'Broker host address is required',help:'DNS/IP address of MQTT broker. e.g. test.mosquitto.org or 192.168.1.5',val:x=>/^[\w.-]+$/.test(x)?null:'Invalid host address'}),
  {row:[N('port','Port',{req:1,def:8080,err:'Port number is required',val:x=>x>=1&&x<=65535?null:'Invalid port'}),
    S('protocol','Network protocol',[['ws','Websocket'],['wss','Websocket-SSL']],{def:'ws',help:'Browsers only speak MQTT over Websocket. Use the broker\'s websocket port. On an https page use Websocket-SSL.'})]},
  T('path','Path',{def:'/mqtt',help:'Websocket path of the broker, usually /mqtt'}),
  {row:[T('username','Username'),T('password','Password',{type:'password'})]}];
const noWild=x=>/[+#]/.test(x)?'Wildcards are not allowed':null;
const TOPIC=T('topic','Topic',{req:1,val:noWild});
const SEND=[{row:[S('qos','QoS',[[0,'0'],[1,'1'],[2,'2']],{def:0}),C('retain','Retain')]},S('color','Button color',COLS,{def:'primary'})];
const PT={
  button:{label:'Button',fields:[T('name','Button name',{req:1}),TOPIC,T('payload','Payload',{req:1}),...SEND],
    card:(p,m)=>h('section',{class:'panel'},h('button',{class:'btn pb',style:`background:${cv(p.color)}`,onclick:()=>send(p,p.payload)},p.name),m)},
  group:{label:'Button group',fields:[T('name','Group name',{req:1}),TOPIC,
    T('items','Buttons',{type:'list',req:1,err:'Add at least one button',addLabel:'Add button',delLabel:'Delete this button',def:[{label:'',payload:''}],
      of:[T('label','Label for button',{req:1,err:'Button label is required'}),T('payload','Payload for button',{req:1,err:'Payload is required'})]}),...SEND],
    card:(p,m)=>h('section',{class:'panel wide'},h('div',{class:'head'},h('b',{},p.name),m),
      h('div',{class:'grp'},p.items.map(it=>h('button',{class:'btn',style:`background:${cv(p.color)}`,onclick:()=>send(p,it.payload)},it.label))))}
};

/* ---------- views ---------- */
function card(p,i){
  const mv=k=>{const j=i+k;if(j<0||j>=db.panels.length)return;[db.panels[i],db.panels[j]]=[db.panels[j],db.panels[i]];save();render()};
  return PT[p.type].card(p,menu([{label:'Edit',fn:()=>go({n:'panel',pid:p.id})},{label:'Move before',fn:()=>mv(-1)},{label:'Move after',fn:()=>mv(1)},
    {label:'Delete',danger:1,fn:()=>{if(confirm(`Delete "${p.name}"?`)){db.panels.splice(i,1);save();render()}}}]))}
const add=()=>go({n:'pick'});
const views={
home(){
  if(db.conn&&!client&&!off)connect();
  const chip=db.conn&&h('button',{id:'st',class:'st '+status,onclick:()=>{if(client){off=true;hangup()}else connect()}},status);
  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},!db.conn?h('div',{class:'empty'},h('p',{},'Connect to your MQTT broker first'),h('button',{class:'btn red',onclick:()=>go({n:'conn'})},'Setup a connection'))
      :db.panels.length?h('div',{class:'panels'},db.panels.map(card))
      :h('div',{class:'empty'},h('p',{},'No buttons yet'),h('button',{class:'btn',onclick:add},'Add a button')),
      db.conn&&db.panels.length?h('button',{class:'btn fab','aria-label':'Add',onclick:add},'+'):null))},
conn(){
  const v=db.conn?structuredClone(db.conn):defaults(CONN,{});
  return page(db.conn?'Edit Connection':'Add Connection',Form(CONN,v,{label:db.conn?'SAVE':'CREATE',cancel:()=>back(),save:x=>{db.conn=x;save();connect();back()}}))},
pick(){return page('Select panel type to add',Object.entries(PT).map(([k,t])=>h('div',{class:'pick',tabindex:0,role:'button',onclick:()=>go({n:'panel',type:k,pick:1})},h('b',{},t.label))))},
panel({pid,type,pick}){
  const ex=pid&&db.panels.find(p=>p.id===pid),t=PT[ex?ex.type:type],v=ex?structuredClone(ex):defaults(t.fields,{id:uid(),type});
  return page((ex?'Edit ':'Add ')+t.label,Form(t.fields,v,{label:ex?'SAVE':'CREATE',cancel:()=>back(),
    save:x=>{const i=db.panels.findIndex(p=>p.id===x.id);i<0?db.panels.push(x):db.panels[i]=x;save();if(pick)stack.pop();back()}}))}
};
function render(){$('#app').replaceChildren(views[route.n](route));window.scrollTo(0,0)}
render();
</script>
</body>
</html>
