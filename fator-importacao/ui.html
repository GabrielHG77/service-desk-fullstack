<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fator de importação</title>
<!-- A janela em modo app herda daqui o ícone da barra de tarefas. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='48' fill='%231d5fbf'/%3E%3Cpath d='M128 48 L128 150 M86 110 L128 152 L170 110' fill='none' stroke='%23fff' stroke-width='22' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='52' y='184' width='152' height='26' rx='13' fill='%239fc0f0'/%3E%3Crect x='52' y='184' width='46' height='26' rx='13' fill='%234ade80'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#f2f4f7; --surface:#fff; --raised:#eef0f3; --border:#e6e6e6; --rule:#f0f0f0; --control:#d4d4d4;
  --text:#0a0a0a; --muted:#5f6368; --primary:#141414; --hue:#1d5fbf;
  --negative:#c4242a; --pill-neg-bg:#ffedea; --pill-neg-ink:#831c1e;
  --radius-card:8px; --radius-control:6px; --gap:12px;
  --fs-title:24px; --fs-body:14px; --fs-small:12px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--ground);color:var(--text);font-size:var(--fs-body);line-height:20px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{padding:20px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.brand{display:flex;gap:10px;align-items:center;padding:6px 12px 2px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.scope{margin:10px 12px 22px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-control);min-width:0}
.scope .s1{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope .s2{font-size:var(--fs-small);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navlbl{font-size:13px;color:var(--muted);padding:0 12px;margin:0 0 8px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 12px;border:0;border-radius:var(--radius-control);background:none;color:var(--text);font:var(--fs-body)/20px var(--font);text-align:left;cursor:pointer}
.nav button:hover{background:#e9ecf1}
.nav button[aria-current]{background:#e4e7ec;font-weight:500}
.nav button .c{margin-left:auto;font-size:var(--fs-small);color:var(--muted)}
.nav button .c.alert{background:var(--pill-neg-bg);color:var(--pill-neg-ink);border-radius:10px;padding:1px 7px}
.side .foot{margin-top:auto;padding:10px 12px 0;border-top:1px solid var(--border)}
.side .foot .u1{font-size:13px;font-weight:500}
.side .foot .u2{font-size:var(--fs-small);color:var(--muted)}
.canvas{padding:32px;max-width:1184px;min-width:0}
.titlerow{display:flex;align-items:flex-start;gap:24px;margin-bottom:28px}
h1{font-size:var(--fs-title);font-weight:700;letter-spacing:-.02em;line-height:30px}
.finding{font-size:15px;line-height:22px;color:var(--muted);margin-top:6px;max-width:620px}
.btn{height:36px;padding:0 16px;border:0;border-radius:var(--radius-control);background:var(--primary);color:#fff;font:500 var(--fs-body)/36px var(--font);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--control)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ml{margin-left:auto;display:flex;gap:8px;align-items:center}
section{margin-bottom:40px}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
h2{font-size:18px;font-weight:500}
.sechead .meta{font-size:var(--fs-body);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.paths{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;margin-bottom:32px;font-size:13px;min-width:0;overflow:hidden}
.paths .pk{color:var(--muted);font-size:var(--fs-small);flex:none}
.paths .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.paths .sep{width:1px;height:18px;background:var(--border);flex:none;margin:0 6px}
.paths .pa{margin-left:auto;flex:none}
.lnk{background:none;border:0;border-bottom:1px solid var(--control);padding:0;font:13px/18px var(--font);color:var(--text);cursor:pointer}
.lnk:hover{border-bottom-color:var(--text)}
.cols{display:grid;grid-template-columns:minmax(0,740px) 368px;gap:var(--gap);align-items:stretch}
.cols>div{min-width:0}
table{width:100%;border-collapse:collapse}
th{font-size:var(--fs-small);font-weight:400;color:var(--muted);text-align:left;padding:0 0 8px}
th.r,td.r{text-align:right}
td{padding:0;height:44px;border-top:1px solid var(--rule);font-size:var(--fs-body)}
tbody tr:first-child td{border-top:1px solid var(--border)}
tr.sel td{background:#f5f8fc;font-weight:500}
tr.sel td.dim{font-weight:400}
.tw{padding:20px 20px 4px}
label.mes{display:flex;align-items:center;gap:10px;cursor:pointer}
.dim{color:var(--muted)}
.neg{color:var(--negative)}
.runcard{display:flex;flex-direction:column}
.runrow{display:flex;align-items:baseline;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--rule)}
.runrow:first-of-type{border-top:0}
.runrow .k{font-size:var(--fs-body);color:var(--muted)}
.runrow .v{font-size:22px;font-weight:500}
.errbox{margin:12px 20px 0;padding:12px;background:var(--raised);border-radius:var(--radius-control)}
.errbox .e1{font-size:13px;font-weight:500;word-break:break-all}
.errbox .e2{font-size:var(--fs-small);color:var(--muted);margin-top:3px;word-break:break-all}
.runfoot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--rule)}
.band .row{display:grid;grid-template-columns:200px minmax(0,1fr) 88px;gap:12px;align-items:center;height:36px}
.band .lbl{font-size:var(--fs-body);display:flex;gap:8px;align-items:baseline;min-width:0}
.band .lbl .m{font-size:var(--fs-small);color:var(--muted)}
.track{position:relative;height:16px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:#dfe6f2;border-left:1px solid #a9bbd6;border-right:1px solid #a9bbd6}
.track .bar{position:absolute;top:4px;height:10px;background:var(--hue);border-radius:2px}
.track .bar.out{background:#9fb6d8}
.band .val{text-align:right;font-size:var(--fs-body);font-weight:500}
.axis{display:grid;grid-template-columns:200px minmax(0,1fr) 88px;gap:12px;margin-top:8px}
.axis .t{position:relative;height:16px;font-size:var(--fs-small);color:var(--muted)}
.axis .t span{position:absolute;transform:translateX(-50%)}
.axis .t span:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:18px;align-items:center;font-size:var(--fs-small);color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:6px}
.vazio{color:var(--muted);padding:20px}
.erro{background:var(--pill-neg-bg);border-color:#f3c7c3;color:var(--pill-neg-ink);padding:12px 16px;margin-bottom:24px}
pre{background:#141414;color:#e6e9ec;padding:16px;border-radius:var(--radius-card);overflow:auto;font-size:12.5px;max-height:420px;white-space:pre-wrap;word-break:break-word;margin:16px 0}
input[type=text]{font:var(--fs-body)/20px var(--font);flex:1;min-width:0;padding:6px 8px;border:1px solid var(--control);border-radius:var(--radius-control)}
.regras dl{padding:4px 20px 20px}
.regras dt{font-weight:500;margin-top:14px}
.regras dd{color:var(--muted);margin-top:2px}
@media print{
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff}
  .side,.titlerow .ml,.paths .pa,.lnk,.btn{display:none!important}
  .app{display:block}
  .canvas{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#ccc}
  section,.sechead{break-inside:avoid}
  .band .row{height:30px}
  .track .zone{background:#e8eef7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .track .bar,.legend i,[style*="background:#1d5fbf"],[style*="background:#9fb6d8"],[style*="background:#8aa0bd"]{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cabecalho-impressao{display:block!important;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #ccc}
  pre{display:none}
}
.cabecalho-impressao{display:none}
@media (max-width:1100px){
  .titlerow{flex-wrap:wrap}.finding{max-width:100%}.ml{margin-left:0;width:100%}
  .cols{grid-template-columns:1fr}
  .band .row,.axis{grid-template-columns:160px minmax(0,1fr) 72px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--border);overflow-x:auto}
  .scope,.navlbl,.side .foot{display:none}
  .nav{display:flex;gap:4px}.nav button{width:auto;white-space:nowrap}
  .canvas{padding:16px;max-width:none}
  .paths{flex-wrap:wrap;height:auto;padding:12px 16px;row-gap:4px}.paths .sep{display:none}.paths .pa{margin-left:0}
  .band .row,.axis{grid-template-columns:104px minmax(0,1fr) 60px;gap:8px}
  .band .lbl .m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="3" width="16" height="3" rx="1" fill="#0a0a0a"/><rect x="1" y="8" width="10" height="3" rx="1" fill="#0a0a0a"/><rect x="1" y="13" width="6" height="3" rx="1" fill="#1d5fbf"/></svg>
      <b>Consolidador</b>
    </div>
    <div class="scope"><div class="s1" id="sc1">—</div><div class="s2" id="sc2"></div></div>
    <p class="navlbl">Trabalho</p>
    <div class="nav" id="nav1"></div>
    <p class="navlbl" style="margin-top:28px">Ajustes</p>
    <div class="nav" id="nav2"></div>
    <div class="foot"><div class="u1">Fator de importação</div><div class="u2">Procurement · BR10</div></div>
  </nav>
  <main class="canvas" id="canvas"><p class="vazio">Carregando…</p></main>
</div>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))
const brl0 = (n) => Math.round(Number(n) || 0).toLocaleString('pt-BR')
const pct = (n) => ((Number(n) || 0) * 100).toFixed(1).replace('.', ',') + '%'
const api = async (rota, body) => {
  const r = await fetch(rota, body ? { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) } : undefined)
  const j = await r.json()
  if (!r.ok) throw new Error(j.erro || r.statusText)
  return j
}

let estado = null, marcados = new Set(), ultima = null, aba = 'consolidar', ocupado = false

const mesesComNovos = () => new Set((estado.meses || []).filter((m) => m.novos > 0).map((m) => m.mes))
const novosMarcados = () => (estado.meses || []).filter((m) => marcados.has(m.mes)).reduce((a, m) => a + m.novos, 0)
const totalPedidos = () => (estado.meses || []).reduce((a, m) => a + m.total, 0)
const errosDaUltima = () => (ultima && ultima.erros) || []

async function carregar(preservarMarcados) {
  const antes = new Set(marcados)
  estado = await api('/api/estado')
  // A última execução volta do disco: fechar e reabrir não perde o histórico.
  if (estado.ultima) {
    ultima = { ...estado.ultima.resultado, quando: estado.ultima.quando, texto: estado.ultima.texto, id: estado.ultima.id }
  }
  marcados = preservarMarcados
    ? new Set([...antes].filter((m) => estado.meses.some((x) => x.mes === m)))
    : mesesComNovos()
  render()
}

const VIEWS = { consolidar: viewConsolidar, graficos: viewGraficos, historico: viewHistorico, erros: viewErros, caminhos: viewCaminhos, regras: viewRegras }

function render() {
  const raiz = estado.cfg.raiz || ''
  document.getElementById('sc1').textContent = raiz.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || '—'
  document.getElementById('sc2').textContent = raiz
  const nErros = errosDaUltima().length
  menu('nav1', [
    ['consolidar', 'Consolidar', null],
    ['historico', 'Histórico', (estado.historico || []).length || null],
    ['graficos', 'Gráficos', null],
    ['erros', 'Pastas com erro', nErros ? { alerta: nErros } : null],
  ])
  menu('nav2', [['caminhos', 'Pastas e planilha', null], ['regras', 'Regras de cálculo', null]])

  const c = document.getElementById('canvas')
  c.innerHTML = ''
  c.append(cabecalhoImpressao())
  c.append(tituloEAcoes())
  if (estado.erro) c.append($(`<div class="card erro">${esc(estado.erro)}</div>`))
  c.append(barraCaminhos())
  c.append(VIEWS[aba]())
}

// Só aparece no PDF: sem isto a folha sai sem dizer de onde vieram os números.
function cabecalhoImpressao() {
  const agora = new Date().toLocaleString('pt-BR')
  return $(`<div class="cabecalho-impressao">
    <div style="font-size:16px;font-weight:600">Fator de importação — ${esc(TITULOS[aba])}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">
      ${esc(estado.cfg.planilha)}<br>
      Faixa ${pct(estado.faixa.min)} a ${pct(estado.faixa.max)} · gerado em ${esc(agora)}</div></div>`)
}

function menu(id, itens) {
  const el = document.getElementById(id)
  el.innerHTML = ''
  for (const [chave, rotulo, extra] of itens) {
    const c = extra && extra.alerta ? `<span class="c alert">${extra.alerta}</span>` : extra ? `<span class="c">${extra}</span>` : ''
    const b = $(`<button ${aba === chave ? 'aria-current="page"' : ''}>${rotulo}${c}</button>`)
    b.onclick = () => { aba = chave; render() }
    el.append(b)
  }
}

// A frase do topo diz o que a analista procuraria batendo o olho na planilha.
function frase() {
  const partes = []
  const novos = novosMarcados()
  if (novos) {
    const ms = (estado.meses || []).filter((m) => marcados.has(m.mes) && m.novos > 0).map((m) => m.mes)
    partes.push(`${novos} pedido${novos === 1 ? '' : 's'} novo${novos === 1 ? '' : 's'} em ${ms.join(', ')}.`)
  } else if (totalPedidos()) {
    partes.push('Nenhum pedido novo para consolidar.')
  }
  const ad = (ultima && ultima.adicionados) || []
  if (ad.length) {
    const fora = ad.filter((p) => p.fator > estado.faixa.max)
    if (fora.length) {
      const maiorCif = Math.max(...fora.map((p) => p.cif))
      partes.push(`Na última execução, ${fora.length} dos ${ad.length} consolidados ficaram acima de ${pct(estado.faixa.max)} — todos com carga de até R$ ${brl0(maiorCif)}.`)
    } else {
      partes.push(`Os ${ad.length} consolidados na última execução ficaram dentro da faixa.`)
    }
  }
  return partes.join(' ')
}

const TITULOS = { consolidar:'Consolidar', graficos:'Gráficos', historico:'Histórico', erros:'Pastas com erro', caminhos:'Pastas e planilha', regras:'Regras de cálculo' }

function tituloEAcoes() {
  const n = novosMarcados()
  const el = $(`<div class="titlerow">
    <div><h1>${TITULOS[aba]}</h1>${aba === 'consolidar' ? `<p class="finding">${esc(frase())}</p>` : ''}</div>
    <div class="ml">
      ${aba === 'graficos' || aba === 'consolidar' ? '<button class="btn ghost" id="b-pdf" title="Abre a janela de impressão: escolha Salvar como PDF">Exportar PDF</button>' : ''}
      <button class="btn ghost" id="b-atualizar" title="Reler as pastas e a planilha">${ocupado ? 'Trabalhando…' : 'Atualizar'}</button>
      <button class="btn ghost" id="b-dry" ${marcados.size && !ocupado ? '' : 'disabled'}>Conferir sem gravar</button>
      <button class="btn" id="b-go" ${n && !ocupado ? '' : 'disabled'}>Consolidar ${n} pedido${n === 1 ? '' : 's'}</button>
    </div></div>`)
  const pdf = el.querySelector('#b-pdf')
  if (pdf) pdf.onclick = () => window.print()
  el.querySelector('#b-atualizar').onclick = atualizar
  el.querySelector('#b-dry').onclick = () => executar({ dryRun: true })
  el.querySelector('#b-go').onclick = () => executar({ dryRun: false })
  return el
}

async function atualizar(ev) {
  const b = ev.target
  b.disabled = true
  b.textContent = 'Atualizando…'
  try {
    await carregar(true)
  } catch (e) {
    b.disabled = false
    b.textContent = 'Atualizar'
    alert(e.message)
  }
}

function barraCaminhos() {
  const el = $(`<div class="paths card">
    <span class="pk">Dados</span><span class="pv">${esc(estado.cfg.raiz)}dados</span>
    <span class="sep"></span>
    <span class="pk">Planilha</span><span class="pv">${esc(estado.cfg.planilha)}</span>
    <span class="pa"><button class="lnk">Alterar</button></span></div>`)
  el.querySelector('button').onclick = () => { aba = 'caminhos'; render() }
  return el
}

function viewConsolidar() {
  const sec = $('<section></section>')
  const cols = $('<div class="cols"></div>')
  cols.append(cardMeses(), cardUltima())
  sec.append(cols)
  const faixa = cardFaixa()
  if (faixa) {
    const s2 = $('<div style="margin-top:40px"></div>')
    s2.append(faixa)
    sec.append(s2)
  }
  return sec
}

function cardMeses() {
  const box = $('<div></div>')
  box.append($(`<div class="sechead"><h2>Meses encontrados</h2><span class="meta">${totalPedidos()} pedidos no total</span></div>`))
  if (!(estado.meses || []).length) {
    box.append($(`<div class="card"><p class="vazio">Nenhuma pasta de mês em <code>${esc(estado.cfg.raiz)}dados</code>.</p></div>`))
    return box
  }
  const card = $(`<div class="card tw"><table>
    <thead><tr><th>Mês</th><th class="r">Pedidos</th><th class="r">Já na planilha</th><th class="r">Novos</th></tr></thead>
    <tbody>${estado.meses.map((m) => `<tr class="${marcados.has(m.mes) ? 'sel' : ''}">
      <td><label class="mes"><input type="checkbox" data-mes="${esc(m.mes)}" ${marcados.has(m.mes) ? 'checked' : ''}> ${esc(m.mes)}</label></td>
      <td class="r num">${m.total}</td>
      <td class="r num dim">${m.existentes}</td>
      <td class="r num ${m.novos ? '' : 'dim'}">${m.novos}</td></tr>`).join('')}
    </tbody></table>
    <p style="font-size:12px;color:var(--muted);padding:12px 0 16px">Pedidos já na planilha são reconhecidos pela N/Ref. e nunca são gravados de novo.</p></div>`)
  card.querySelectorAll('input[data-mes]').forEach((c) => {
    c.onchange = () => {
      if (c.checked) marcados.add(c.dataset.mes); else marcados.delete(c.dataset.mes)
      render()
    }
  })
  box.append(card)
  return box
}

function cardUltima() {
  const box = $('<div></div>')
  box.append($('<div class="sechead"><h2>Última execução</h2></div>'))
  if (!ultima) {
    box.append($('<div class="card"><p class="vazio">Nenhuma execução ainda.</p></div>'))
    return box
  }
  const erros = ultima.erros || []
  const card = $(`<div class="card runcard" style="height:calc(100% - 38px)">
    <div class="runrow"><span class="k">Adicionados</span><span class="v num">${(ultima.adicionados || []).length}</span></div>
    <div class="runrow"><span class="k">Pulados, já existiam</span><span class="v num dim">${(ultima.pulados || []).length}</span></div>
    <div class="runrow"><span class="k">Pastas com erro</span><span class="v num ${erros.length ? 'neg' : 'dim'}">${erros.length}</span></div>
    ${erros.slice(0, 3).map((e) => `<div class="errbox">
      <div class="e1">${esc(e.mes)} / ${esc(e.modal)} / ${esc(e.nref)}</div>
      <div class="e2">${esc(e.motivo)}</div></div>`).join('')}
    ${erros.length > 3 ? `<div class="errbox"><div class="e2">e mais ${erros.length - 3}…</div></div>` : ''}
    <div class="runfoot"><button class="lnk">Ver execução de ${esc(ultima.quando)}${ultima.dryRun ? ' (conferência)' : ''}</button></div></div>`)
  card.querySelector('.runfoot button').onclick = () => { aba = 'historico'; render() }
  box.append(card)
  return box
}

// Faixa 24%–30%: cada pedido consolidado sobre a faixa, ordenado por valor de carga.
function cardFaixa() {
  const ps = [...((ultima && ultima.adicionados) || [])].sort((a, b) => a.cif - b.cif)
  if (!ps.length) return null
  return banda(ps, `Fator dos ${ps.length} pedido${ps.length === 1 ? '' : 's'} consolidado${ps.length === 1 ? '' : 's'}`)
}

// Faixa configurável: cada pedido sobre a faixa, ordenado por valor de carga.
function banda(ps, titulo) {
  const min = estado.faixa.min, max = estado.faixa.max
  const MAX = Math.max(0.7, ...ps.map((p) => p.fator)) * 1.06
  const x = (f) => Math.min(100, (f / MAX) * 100)
  const zona = `left:${x(min)}%;width:${x(max) - x(min)}%`
  const ticks = []
  for (let v = 0; v <= MAX; v += 0.3) ticks.push(v)

  const cif = ps.reduce((a, p) => a + p.cif, 0)
  const total = ps.reduce((a, p) => a + p.total, 0)
  const ponderado = cif ? total / cif : 0

  const box = $('<div></div>')
  box.append($(`<div class="sechead"><h2>${esc(titulo)}</h2>
    <span class="legend">
      <span><i style="background:#dfe6f2"></i>faixa ${pct(min)} a ${pct(max)}</span>
      <span><i style="background:#1d5fbf"></i>dentro</span>
      <span><i style="background:#9fb6d8"></i>fora</span></span></div>`))
  box.append($(`<div class="card" style="padding:20px"><div class="band">
    <div class="row" style="height:auto;margin-bottom:6px">
      <span style="font-size:12px;color:var(--muted)">Pedido, por valor de carga</span><span></span>
      <span style="font-size:12px;color:var(--muted);text-align:right">Fator</span></div>
    ${ps.map((p) => {
      const fora = p.fator < min || p.fator > max
      return `<div class="row">
        <span class="lbl">${esc(p.nref)} <span class="m">R$ ${brl0(p.cif)}</span></span>
        <span class="track"><i class="zone" style="${zona}"></i><i class="bar ${fora ? 'out' : ''}" style="width:${x(p.fator)}%"></i></span>
        <span class="val num ${fora ? 'neg' : ''}">${pct(p.fator)}</span></div>`
    }).join('')}
    <div class="axis"><span></span><span class="t">${ticks.map((v) => `<span style="left:${x(v)}%">${Math.round(v * 100)}%</span>`).join('')}</span><span></span></div>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:14px">Somados, os ${ps.length} pedidos dão fator de ${pct(ponderado)} sobre R$ ${brl0(cif)} de carga — ${ponderado >= min && ponderado <= max ? 'dentro da faixa' : 'fora da faixa'}. Fator alto em pedido pequeno é esperado: as despesas fixas por processo não acompanham o valor da carga.</p>
  </div>`))
  return box
}

function viewHistorico() {
  const sec = $('<section></section>')
  const h = estado.historico || []
  if (!h.length) {
    sec.append($('<div class="card"><p class="vazio">Nenhuma execução registrada.</p></div>'))
    return sec
  }
  sec.append($(`<div class="sechead"><h2>Execuções</h2><span class="meta">as ${h.length} mais recentes, guardadas em historico.json</span></div>`))
  const card = $(`<div class="card tw"><table>
    <thead><tr><th>Quando</th><th>Tipo</th><th class="r">Adicionados</th><th class="r">Pulados</th><th class="r">Erros</th><th></th></tr></thead>
    <tbody>${h.map((x) => `<tr><td>${esc(x.quando)}</td><td class="dim">${x.dryRun ? 'conferência' : 'gravação'}</td>
      <td class="r num">${x.adicionados}</td><td class="r num dim">${x.pulados}</td>
      <td class="r num ${x.erros ? 'neg' : 'dim'}">${x.erros}</td>
      <td class="r"><button class="lnk" data-log="${esc(x.id)}">Ver registro</button></td></tr>`).join('')}
    </tbody></table><div id="log-alvo"></div></div>`)
  card.querySelectorAll('button[data-log]').forEach((b) => {
    b.onclick = async () => {
      try {
        const e = await api('/api/log/' + b.dataset.log)
        const alvo = card.querySelector('#log-alvo')
        alvo.innerHTML = ''
        alvo.append($(`<pre>${esc(e.texto)}</pre>`))
      } catch (err) { alert(err.message) }
    }
  })
  sec.append(card)
  const acao = $(`<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn ghost" id="b-re" ${marcados.size && !ocupado ? '' : 'disabled'}>Reprocessar os meses marcados</button>
    <span class="dim" style="font-size:13px">Apaga da planilha as linhas daqueles meses e consolida de novo. Nunca acontece só por marcar o mês.</span></div>`)
  acao.querySelector('#b-re').onclick = () => {
    if (confirm(`Apagar da planilha as linhas de ${[...marcados].join(', ')} e consolidar de novo?`)) {
      executar({ dryRun: false, reprocessar: true })
    }
  }
  sec.append(acao)
  return sec
}

function viewErros() {
  const sec = $('<section></section>')
  const erros = errosDaUltima()
  if (!erros.length) {
    sec.append($('<div class="card"><p class="vazio">Nenhuma pasta falhou na última execução.</p></div>'))
    return sec
  }
  sec.append($(`<div class="sechead"><h2>${erros.length} pasta${erros.length === 1 ? '' : 's'} pulada${erros.length === 1 ? '' : 's'}</h2>
    <span class="meta">na execução de ${esc(ultima.quando)}</span></div>`))
  sec.append($(`<div class="card" style="padding:8px 0 20px">
    ${erros.map((e) => `<div class="errbox">
      <div class="e1">${esc(e.mes)} / ${esc(e.modal)} / ${esc(e.nref)}</div>
      <div class="e2">${esc(e.motivo)}</div>
      <div class="e2" style="margin-top:6px"><code>${esc(e.pasta)}</code></div></div>`).join('')}
    <p style="font-size:13px;color:var(--muted);padding:16px 20px 0">O pedido inteiro foi pulado. Corrija a pasta e rode de novo — nada do que já está na planilha é reescrito.</p></div>`))
  return sec
}

function viewCaminhos() {
  const sec = $('<section></section>')
  const card = $(`<div class="card" style="padding:4px 20px 20px">
    <div style="padding:16px 0">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Pasta dos dados</div>
      <div style="display:flex;gap:10px"><input type="text" id="f-raiz" value="${esc(estado.cfg.raiz)}"></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Tem que conter a subpasta <code>dados</code>, com <code>dados\\&lt;mês&gt;\\&lt;modal&gt;\\&lt;pedido&gt;</code>.</div></div>
    <div style="padding:16px 0;border-top:1px solid var(--rule)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Planilha de destino</div>
      <div style="display:flex;gap:10px"><input type="text" id="f-pl" value="${esc(estado.cfg.planilha)}"></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Apague o conteúdo para voltar a <code>&lt;raiz&gt;\\ConsolidadoPath.xlsx</code>. Antes de gravar, é copiada para <code>ConsolidadoPath.bak.xlsx</code>.</div></div>
    <div style="display:flex;gap:10px;padding-top:4px">
      <button class="btn" id="b-salvar">Salvar</button>
      <button class="btn ghost" id="b-cancelar">Cancelar</button></div></div>`)
  card.querySelector('#b-cancelar').onclick = () => { aba = 'consolidar'; render() }
  card.querySelector('#b-salvar').onclick = async (ev) => {
    ev.target.disabled = true
    try {
      estado = await api('/api/config', { raiz: card.querySelector('#f-raiz').value, planilha: card.querySelector('#f-pl').value })
      marcados = mesesComNovos()
      aba = 'consolidar'
      render()
    } catch (err) {
      ev.target.disabled = false
      alert(err.message)
    }
  }
  sec.append(card)
  return sec
}

function viewRegras() {
  const r = estado.regras
  const sec = $('<section></section>')
  const comps = estado.componentes || []
  const card = $(`<div class="card" style="padding:4px 20px 20px">
    <div style="padding:16px 0">
      <div style="font-weight:500;margin-bottom:4px">Faixa esperada</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Fora dela o pedido entra na lista de avisos e aparece destacado no gráfico. Não impede a gravação.</div>
      <div style="display:flex;gap:10px;align-items:center">
        <input type="number" id="f-min" step="0.5" min="0" max="999" value="${(r.faixa.min * 100).toFixed(1)}" style="width:90px">
        <span class="dim">% até</span>
        <input type="number" id="f-max" step="0.5" min="0" max="999" value="${(r.faixa.max * 100).toFixed(1)}" style="width:90px">
        <span class="dim">%</span></div></div>

    <div style="padding:16px 0;border-top:1px solid var(--rule)">
      <div style="font-weight:500;margin-bottom:4px">O que entra no custo</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Muda o Total, o Percentual e a fórmula gravada na planilha. Vale para as próximas consolidações; o que já está gravado só muda ao reprocessar o mês.</div>
      ${comps.map((c) => `<label class="mes" style="padding:5px 0">
        <input type="checkbox" data-comp="${esc(c.chave)}" ${r.custo.includes(c.chave) ? 'checked' : ''}>
        ${esc(c.rotulo)}${c.imposto ? ' <span class="dim" style="font-size:12px">· imposto</span>' : ''}</label>`).join('')}
      <div style="font-size:12px;color:var(--muted);margin-top:10px">A coluna <code>Outros</code> entra sempre: é o campo que você preenche à mão na planilha.</div></div>

    <div style="padding:16px 0;border-top:1px solid var(--rule)">
      <div style="font-weight:500;margin-bottom:4px">Fora da conta, de propósito</div>
      <div style="font-size:12px;color:var(--muted)">PIS, COFINS e ICMS não aparecem acima porque são recuperáveis — a empresa credita depois, então não são despesa de importação. O app nem chega a ler essas colunas. Incluí-los já fez o fator aparecer entre 69% e 200%, o que parecia bug e era a conta errada.</div></div>

    <div style="display:flex;gap:10px;padding-top:4px;align-items:center">
      <button class="btn" id="b-salvar">Salvar regras</button>
      <button class="btn ghost" id="b-padrao">Voltar ao padrão</button>
      <span class="dim" id="aviso-regras" style="font-size:13px"></span></div></div>`)

  const lidas = () => ({
    faixa: { min: Number(card.querySelector('#f-min').value) / 100, max: Number(card.querySelector('#f-max').value) / 100 },
    custo: [...card.querySelectorAll('input[data-comp]:checked')].map((c) => c.dataset.comp),
  })
  const salvar = async (regras, botao) => {
    botao.disabled = true
    try {
      estado = await api('/api/regras', regras)
      planilha = null // os gráficos são recalculados com as regras novas
      render()
    } catch (e) { botao.disabled = false; alert(e.message) }
  }
  card.querySelector('#b-salvar').onclick = (e) => {
    const v = lidas()
    if (!(v.faixa.min >= 0 && v.faixa.max > v.faixa.min)) {
      card.querySelector('#aviso-regras').textContent = 'A faixa máxima tem que ser maior que a mínima.'
      return
    }
    if (!v.custo.length) {
      card.querySelector('#aviso-regras').textContent = 'Escolha pelo menos um componente.'
      return
    }
    salvar(v, e.target)
  }
  card.querySelector('#b-padrao').onclick = (e) => salvar({ faixa: { min: 0.24, max: 0.30 }, custo: comps.map((c) => c.chave) }, e.target)
  sec.append(card)
  return sec
}


let planilha = null // o que já está gravado, carregado sob demanda

function viewGraficos() {
  const sec = $('<section></section>')
  if (!planilha) {
    sec.append($('<div class="card"><p class="vazio">Lendo a planilha…</p></div>'))
    api('/api/planilha').then((r) => { planilha = r; if (aba === 'graficos') render() })
      .catch((e) => { planilha = { pedidos: [], aviso: e.message }; if (aba === 'graficos') render() })
    return sec
  }
  const ps = planilha.pedidos || []
  if (!ps.length) {
    sec.append($(`<div class="card"><p class="vazio">${esc(planilha.aviso || 'A planilha ainda não tem pedidos consolidados.')}</p></div>`))
    return sec
  }
  sec.append(resumoGeral(ps))
  sec.append(graficoMeses(ps))
  sec.append(graficoComposicao(ps))
  const b = banda([...ps].sort((a, b) => a.cif - b.cif), `Fator dos ${ps.length} pedidos da planilha`)
  const wrap = $('<div style="margin-top:40px"></div>')
  wrap.append(b)
  sec.append(wrap)
  return sec
}

const ponderado = (ps) => {
  const cif = ps.reduce((a, p) => a + p.cif, 0)
  return { cif, total: ps.reduce((a, p) => a + p.total, 0), imposto: ps.reduce((a, p) => a + p.imposto, 0),
           fator: cif ? ps.reduce((a, p) => a + p.total, 0) / cif : 0,
           logistico: cif ? (ps.reduce((a, p) => a + p.total, 0) - ps.reduce((a, p) => a + p.imposto, 0)) / cif : 0 }
}

function resumoGeral(ps) {
  const box = $('<div></div>')
  box.append($('<div class="sechead"><h2>Resumo da planilha</h2><span class="meta">fator ponderado: soma dos custos ÷ soma do CIF</span></div>'))
  const linha = (rot, lista) => {
    if (!lista.length) return ''
    const t = ponderado(lista)
    return `<div class="runrow"><span class="k">${rot} · ${lista.length} pedido${lista.length === 1 ? '' : 's'}</span>
      <span><span class="v num">${pct(t.fator)}</span>
      <span class="dim" style="font-size:12px;margin-left:10px">logístico ${pct(t.logistico)} · R$ ${brl0(t.cif)} de carga</span></span></div>`
  }
  box.append($(`<div class="card">
    ${linha('Tudo', ps)}
    ${linha('SEA', ps.filter((p) => p.modal === 'SEA'))}
    ${linha('AIR', ps.filter((p) => p.modal === 'AIR'))}</div>`))
  return box
}

// Fator ponderado por mês, separado por modal: responde se está melhorando.
function graficoMeses(ps) {
  const meses = [...new Set(ps.map((p) => p.mes).filter(Boolean))].sort()
  const box = $('<div style="margin-top:40px"></div>')
  if (meses.length < 2) return box
  const min = estado.faixa.min, max = estado.faixa.max
  const dados = meses.map((m) => ({ mes: m,
    SEA: ponderado(ps.filter((p) => p.mes === m && p.modal === 'SEA')),
    AIR: ponderado(ps.filter((p) => p.mes === m && p.modal === 'AIR')) }))
  const MAX = Math.max(max * 1.3, ...dados.flatMap((d) => [d.SEA.fator, d.AIR.fator])) * 1.08
  const alt = (f) => Math.max(1, (f / MAX) * 150)

  box.append($(`<div class="sechead"><h2>Fator ponderado por mês</h2>
    <span class="legend"><span><i style="background:#1d5fbf"></i>marítimo</span><span><i style="background:#9fb6d8"></i>aéreo</span>
    <span><i style="background:#dfe6f2"></i>faixa ${pct(min)} a ${pct(max)}</span></span></div>`))
  box.append($(`<div class="card" style="padding:20px">
    <div style="position:relative;height:170px;display:flex;align-items:flex-end;gap:18px;border-bottom:1px solid var(--border);padding:0 4px">
      <div style="position:absolute;left:0;right:0;bottom:${(min / MAX) * 150}px;height:${((max - min) / MAX) * 150}px;background:#dfe6f2"></div>
      ${dados.map((d) => `<div style="flex:1;display:flex;gap:4px;align-items:flex-end;justify-content:center;position:relative;z-index:1">
        ${['SEA', 'AIR'].map((m) => d[m].cif ? `<div title="${m} ${pct(d[m].fator)}" style="width:22px;height:${alt(d[m].fator)}px;background:${m === 'SEA' ? '#1d5fbf' : '#9fb6d8'};border-radius:2px 2px 0 0"></div>` : '').join('')}
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:18px;padding:6px 4px 0">
      ${dados.map((d) => `<div style="flex:1;text-align:center;font-size:12px;color:var(--muted)">${esc(d.mes)}<br>
        <span style="color:var(--text)">${d.SEA.cif ? pct(d.SEA.fator) : ''}${d.SEA.cif && d.AIR.cif ? ' · ' : ''}${d.AIR.cif ? pct(d.AIR.fator) : ''}</span></div>`).join('')}
    </div></div>`))
  return box
}

// Quanto do custo é imposto e quanto é logística: a parte sobre a qual uma
// decisão de compra ou de despachante muda alguma coisa.
function graficoComposicao(ps) {
  const box = $('<div style="margin-top:40px"></div>')
  box.append($(`<div class="sechead"><h2>De onde vem o custo</h2>
    <span class="legend"><span><i style="background:#8aa0bd"></i>imposto</span><span><i style="background:#1d5fbf"></i>logística</span></span></div>`))
  const barra = (rot, lista) => {
    if (!lista.length) return ''
    const t = ponderado(lista)
    if (!t.total) return ''
    const fImp = (t.imposto / t.total) * 100
    return `<div style="padding:14px 20px;border-top:1px solid var(--rule)">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
        <span>${rot}</span><span class="dim num">imposto ${pct(t.imposto / t.cif)} · logística ${pct(t.logistico)}</span></div>
      <div style="display:flex;height:18px;border-radius:3px;overflow:hidden">
        <div style="width:${fImp}%;background:#8aa0bd"></div><div style="flex:1;background:#1d5fbf"></div></div></div>`
  }
  box.append($(`<div class="card" style="padding-top:2px">
    ${barra('Marítimo', ps.filter((p) => p.modal === 'SEA'))}
    ${barra('Aéreo', ps.filter((p) => p.modal === 'AIR'))}
    <p style="font-size:13px;color:var(--muted);padding:14px 20px 18px;border-top:1px solid var(--rule)">
      A alíquota de imposto é parecida nos dois modais, então o fator cheio esconde a diferença entre eles. A parte logística é a que responde a decisão de compra.</p></div>`))
  return box
}

async function executar(opts) {
  ocupado = true
  render()
  try {
    await api('/api/rodar', { meses: [...marcados], ...opts })
    ocupado = false
    await carregar(opts.dryRun) // relê tudo, inclusive o histórico já gravado
    aba = 'consolidar'
    render()
  } catch (e) {
    ocupado = false
    render()
    alert('Falhou: ' + e.message)
  }
}

// Sinal de vida: fechar a janela encerra o app do outro lado.
setInterval(() => { fetch('/api/vivo').catch(() => {}) }, 20000)
fetch('/api/vivo').catch(() => {})

carregar(false).catch((e) => {
  document.getElementById('canvas').innerHTML = `<div class="card erro">${esc(e.message)}</div>`
})
</script>
