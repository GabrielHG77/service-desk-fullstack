<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MQTT Panel</title>
<style>
:root{--primary:#f2d740;--black:#0c0e0f;--secondary:#3dc2ff;--tertiary:#5260ff;--success:#2dd36f;--warning:#ffc409;--danger:#eb445a;--medium:#92949c;
  --bg:#f4f5f8;--card:#fff;--fg:#1c1c1e;--line:#d7d8da;--sub:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--fg:#f2f2f2;--line:#3a3a3a;--sub:#aaa;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--black);color:#fff;border-bottom:3px solid var(--primary)}
.bar h1{font-size:18px;margin:0;font-weight:500}.sp{flex:1}
.ic{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;padding:4px 8px}
main{max-width:720px;margin:0 auto;padding:12px 16px 96px}
.btn{border:0;border-radius:4px;padding:12px 16px;font:inherit;font-weight:600;text-transform:uppercase;cursor:pointer;background:var(--primary);color:var(--black)}
.btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.btn:active{filter:brightness(.8)}.btn.gray{background:var(--medium);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}.btn.lg{padding:16px 24px;font-size:17px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 8px #0006;z-index:6}
.fld{margin:0 0 12px}.lh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:3px}
.fld label{font-size:13px;color:var(--sub)}.fld .chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg)}.chk input{width:auto}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
input[type=color]{padding:2px;height:40px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.req{color:var(--danger)}
.q{border:0;border-radius:50%;width:18px;height:18px;font-size:11px;background:var(--primary);color:var(--black);cursor:pointer;padding:0}
.help{color:var(--sub);display:block;margin-top:3px}.err{white-space:pre-line;color:var(--danger);margin:8px 0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pickrow{margin:6px 0}.pickrow .help{margin:0}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.pick{background:var(--card);border-radius:8px;padding:16px;margin-bottom:8px;cursor:pointer}
.menu{position:relative;display:inline-block}.menu summary{list-style:none;cursor:pointer;padding:2px 8px;font-size:20px}.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:100%;background:var(--card);color:var(--fg);box-shadow:0 2px 8px #0005;border-radius:6px;z-index:10;min-width:150px;display:flex;flex-direction:column}
.pop button{background:none;border:0;text-align:left;padding:10px 14px;font:inherit;color:inherit;cursor:pointer}.pop .dng{color:var(--danger)}
.panels{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--card);border-radius:8px;padding:10px;position:relative;box-shadow:0 1px 3px #0003;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.panel>*{max-width:100%}.panel .menu{position:absolute;top:2px;right:2px}.pname{font-weight:600;font-size:14px;margin-right:24px}
.pb{min-width:90px}.pb[aria-pressed=true]{box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--black)}.grp{display:flex;flex-wrap:wrap;gap:8px;width:100%}.grp .btn{flex:1 1 90px}
.empty{text-align:center;padding:48px 0;color:var(--sub)}
.st{border:0;border-radius:12px;padding:3px 10px;font:12px system-ui;cursor:pointer;color:#fff;background:var(--medium)}.st.connected{background:var(--success)}.st.connecting{background:var(--warning)}.st.error{background:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:#000d;color:#fff;padding:8px 14px;border-radius:20px;z-index:50}
.tabs{display:flex;margin:0 0 12px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 0;font:inherit;font-weight:600;text-transform:uppercase;color:var(--sub);cursor:pointer}
.tabs .on{color:var(--fg);border-bottom-color:var(--primary)}
.box{margin-bottom:8px;align-items:stretch}.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}.box .row2{margin:0}
.pill{border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--medium);color:#fff}
.pill.ready,.pill.running{background:var(--success)}.pill.online{background:var(--warning);color:var(--black)}.pill.offline{background:var(--danger)}
.btns2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.diag{display:block;white-space:pre-line;word-break:break-word;margin-top:4px}
.logview{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.35;max-height:48vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
#logbox{width:100%;height:30vh;font-size:11px;margin-top:8px}.quick{justify-content:flex-start;margin:6px 0}#note{flex:1}
.feed{margin-top:12px}.feed summary{cursor:pointer;color:var(--sub)}.feed pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:8px 0}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:18px 0 8px}
.allrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.allrow .btn{padding:16px 8px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:10px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tile,.bcard{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px #0003;border-left:4px solid var(--medium)}
.tile.run,.bcard.run{border-left-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}.bcard.on{border-left-color:var(--success)}.bcard.off{border-left-color:var(--danger)}
.thead,.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.tname,.bname{font-size:20px}
.tsub{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;margin:2px 0 10px;min-height:22px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.trow .btn{padding:12px 8px}
.bcard{margin-bottom:10px}.bsub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 8px;color:var(--sub);font-size:13px}.bip{color:var(--fg);font-weight:600;font-size:16px;margin-right:4px}
.tag{background:var(--line);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--line);color:var(--fg)}
.chip.good{background:var(--success);color:#fff}.chip.bad{background:var(--danger);color:#fff}.chip.live{background:var(--primary);color:var(--black)}
.mrows{margin:8px 0 4px}.mrow{display:grid;grid-template-columns:22px 1fr auto auto;gap:3px 10px;align-items:center;padding:7px 0 5px;border-top:1px solid var(--line);font-size:14px}
.mn{font-weight:700}.mt{color:var(--sub)}.mst{font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--success);color:#fff}.mst.bad{background:var(--danger)}
.msp{font-size:13px;font-variant-numeric:tabular-nums}.sbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.sbar i{display:block;height:100%;background:var(--primary)}
.evt{margin:6px 0 2px}.evt summary{cursor:pointer;color:var(--sub);font-size:13px}.bact{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.bact .btn{padding:9px 20px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
const uid=()=>Math.random().toString(36).slice(2,10);
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
let tt;const toast=m=>{log('ui.toast',{text:m});const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,Math.max(2500,m.length*70))};
const COL={primary:'#f2d740',secondary:'#3dc2ff',tertiary:'#5260ff',success:'#2dd36f',warning:'#ffc409',danger:'#eb445a',medium:'#92949c'};
const COLS=Object.keys(COL).map(k=>[k,k[0].toUpperCase()+k.slice(1)]);
const fill=c=>{const k=COL[c]?c:'primary';return `background:${COL[k]};color:${k==='primary'||k==='warning'?'#0c0e0f':'#fff'}`};   // white text is unreadable on the two yellows

/* ---------- storage (ponytail: password in plain localStorage; fine for personal use, encrypt if the device is shared) ---------- */
const KEY='mqtt-buttons-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db=db&&Array.isArray(db.panels)?db:{conn:null,panels:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){log('app.storage_error',{level:'error',err:e.message});toast('Could not save (storage blocked)')}};

/* ---------- log: everything that happens, one line each, to be read by a person or by an assistant. The Windows program keeps the same lines in a file (mqtt-panel.log) ---------- */
// line: <local time> T+<seconds since the program started> <tag.event> key=value ...   (the same format the program writes, so both sort into one story)
const LOG=[],OUT=[],T0=Date.now(),SAFE=/^[\w.:/+#$@<>-]+$/;let progStart=null,INFO=null,sink=true,logAll=false;
const pad=(n,w=2)=>String(n).padStart(w,'0'),
  stamp=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}`},
  val=v=>{if(v==null)return 'null';if(typeof v==='object')v=JSON.stringify(v);if(typeof v!=='string')return String(v);const r=[...v];
    return r.length>300?JSON.stringify(r.slice(0,300).join('')+`…(+${r.length-300})`):v!==''&&SAFE.test(v)?v:JSON.stringify(v)},
  fmt=e=>`${stamp(e.t)} T+${((e.t-(progStart??T0))/1000).toFixed(3)} ${e.tag}${Object.entries(e.d||{}).filter(([,v])=>v!==undefined).map(([k,v])=>` ${k}=${val(v)}`).join('')}`;
function log(tag,d){const e={t:Date.now(),tag,d};LOG.push(e);OUT.push(e);if(LOG.length>20000)LOG.splice(0,2000);if(OUT.length>20000)OUT.splice(0,2000);return e}
function flush(beacon){   // sends what is new to the program, which writes it in the file
  if(!sink||progStart==null||!OUT.length)return;
  const text=OUT.splice(0,500).map(fmt).join('\n')+'\n';
  if(beacon&&navigator.sendBeacon){navigator.sendBeacon('/log',new Blob([text],{type:'text/plain'}));return}
  fetch('/log',{method:'POST',headers:{'Content-Type':'text/plain'},body:text}).then(r=>{if(!r.ok)sink=false},()=>{sink=false})}   // no Windows program behind this page: the lines stay here
setInterval(flush,500);
fetch('/info',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(i=>{INFO=i;progStart=i.startedAt;
  log('app.program',{run:i.run,pid:i.pid,host:i.host,user:i.user,os:i.os,go:i.go,exe:i.exe,page_hash:i.page,vcs:i['vcs.revision']?String(i['vcs.revision']).slice(0,8)+(i['vcs.modified']==='true'?'+modified':''):null,net:i.net,log_file:i.logPath})},
  ()=>{progStart=T0;sink=false;log('app.program',{note:'no Windows program behind this page, so the lines stay in the page'})});
let beat=Date.now();setInterval(()=>{const n=Date.now(),gap=n-beat;beat=n;   // a page that was frozen or throttled misses its keepalive pings: that can look like the broker dropping it
  if(gap>3000)log('app.stall',{level:'warn',gap_ms:gap,hidden:document.hidden,note:'the page did not run for that long: window hidden or throttled, PC asleep, or busy'})},1000);
setInterval(()=>log('board.snapshot',{conn:status,connected:!!client?.connected,boards:[...boards.values()].map(b=>`${b.id}:${b.state||'?'}${b.live?'':'(stored)'}@${b.ip||'?'}`).join(' ')||null,kept_commands:held.size,messages:feed.length}),60000);
addEventListener('error',e=>log('app.error',{level:'error',msg:e.message,at:`${String(e.filename||'').split('/').pop()}:${e.lineno}:${e.colno}`,stack:String(e.error?.stack||'').slice(0,500)}));
addEventListener('unhandledrejection',e=>log('app.rejection',{level:'error',reason:String(e.reason?.message||e.reason),stack:String(e.reason?.stack||'').slice(0,500)}));
for(const k of ['error','warn']){const o=console[k];console[k]=(...a)=>{log('app.console',{level:k==='error'?'error':'warn',msg:a.map(x=>x instanceof Error?x.message:String(x)).join(' ').slice(0,400)});o.apply(console,a)}}
document.addEventListener('visibilitychange',()=>log('app.visibility',{state:document.visibilityState}));
addEventListener('online',()=>log('app.network',{online:true}));addEventListener('offline',()=>log('app.network',{level:'warn',online:false}));
addEventListener('pagehide',()=>{log('app.pagehide',{});while(OUT.length&&sink&&progStart!=null)flush(true)});
document.addEventListener('click',e=>{const el=e.target.closest?.('button,summary,a,[role=button],input[type=checkbox],select');   // never the value of a field: it may be a password
  if(el)log('ui.click',{el:el.id||el.className||el.tagName.toLowerCase(),text:el.matches('input,select')?undefined:(el.textContent||'').trim().slice(0,40),route:typeof route==='undefined'?null:route.n})},true);

const panelInfo=p=>({name:p.name,id:p.id,action:kind(p)==='msg'?undefined:kind(p),motor:isSpin(p)?`${p.board}/${p.motorNo||'all'} at normal speed`:undefined,topic:nm(p)?p.topic:undefined,payload:nm(p)?(p.noPayload?'(empty)':p.payload):undefined,payload_off:p.toggle?p.payloadOff:undefined,toggle:p.toggle||undefined,payload_release:p.payloadRel||undefined,
  repeat_ms:p.repeat?p.repInt:undefined,qos:p.qos,retain:p.retain||undefined,confirm:p.confirm||undefined,json:p.isJson||undefined,members:p.members?.join(',')});

/* ---------- MQTT ---------- */
const BRIDGE=false;   // the Windows program serves this page with true: it relays Websocket <-> plain TCP, so the broker's normal port 1883 works
let client=null,status='disconnected',off=false;
const setStatus=s=>{if(s!==status)note('app','connection '+s);status=s;const e=$('#st');if(e){e.className='st '+s;e.textContent=s}touch()};
// what the boards say about themselves (MCP PLAY manual 18.6): <name>/discovery (JSON, published once at boot and kept by the broker, so it can be gone), <name>/status (offline, online, ready, running)
// and <name>/network/ip, the live answer to <name>/network/ip/get (18.6.4), which is where the IP comes from when discovery is missing.
// Everything else (answers to Diagnose, events, watchdogs) comes through the "#" filter and is listed raw. shortcut: a busy shared broker would flood this page, filter by board name then
const SUBS=['#','$SYS/broker/clients/connected','$SYS/broker/version'];
const boards=new Map(),feed=[],held=new Map();let sys={},denied=[],dirty=false;
const note=(t,m)=>{feed.unshift({t,m,at:Date.now()});feed.length=Math.min(feed.length,300)};   // the app's own events sit in the list of messages, next to what the boards said
// a command kept (retained) by the broker is handed to a board again every time it connects: held lists the ones seen, to show and clear them
const CMD=/\/command\/|\/set$|\/(stopflow|continue)$|^network_broadcast\//;
const touch=()=>{if(dirty)return;dirty=true;setTimeout(()=>{dirty=false;if(route.n==='status')draw();else if(route.n==='home')drawHome()},250)};   // at most 4 redraws a second, retained messages arrive in bursts
const CTRL=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g;
function onMsg(t,raw,stored,pk){   // stored: the broker replays a retained message = the board spoke once, not proof it is there now. Only a live message or an answer makes a board "live"
  const m=raw.replace(CTRL,'');   // a board may end its text with a zero byte ("ready\0"): that is not "ready", and pasted on Windows the text stops at that byte. The log keeps the original
  if(!stored&&!ECHO.test(t)){const b0=boards.get(t.split('/')[0]);if(b0)b0.heard=Date.now()}   // any live message of a board, except our own request coming back: "no answer" is judged on this
  if(!t.startsWith('$SYS/')){feed.unshift({t,m:m.slice(0,2000),at:Date.now(),stored});feed.length=Math.min(feed.length,300)}
  log('mqtt.in',{conn:cn,topic:t,payload:raw,retain:!!stored,qos:pk?.qos,dup:pk?.dup||undefined,bytes:raw.length});
  if(stored&&m!==''&&CMD.test(t)&&!held.has(t)){held.set(t,m);log('board.held_command',{level:'warn',topic:t,payload:m,note:'the broker keeps this command and gives it to the board every time it connects'})}
  let x;const dev=id=>{let b=boards.get(id);if(!b){b={id};boards.set(id,b);log('board.new',{id,topic:t,stored})}if(!stored&&!b.live){b.live=true;log('board.live',{id,topic:t})}if(!stored)b.heard=Date.now();return b};
  if(t==='$SYS/broker/clients/connected')sys.clients=m;
  else if(t==='$SYS/broker/version')sys.version=m;
  else if(x=/^([^/]+)\/discovery$/.exec(t)){try{const d=JSON.parse(m),b=dev(x[1]),ip0=b.ip;Object.assign(b,{host:d.hostname,mac:d.mac,sw:d.swAppVersion});if(d.ip&&!b.ipLive)b.ip=d.ip;   // the board's own answer beats the boot-time IP
    if(b.ip!==ip0)log('board.ip',{id:b.id,from:ip0??null,to:b.ip,source:'discovery',stored})}catch(e){log('board.bad_json',{level:'warn',topic:t,err:e.message})}}
  else if(x=/^([^/]+)\/network\/ip$/.exec(t)){const ip=m.trim().replace(/^"|"$/g,'');
    if(/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)){const b=dev(x[1]);if(b.ip!==ip)log('board.ip',{id:b.id,from:b.ip??null,to:ip,source:stored?'stored answer':'answer',stored});b.ip=ip;if(!stored)b.ipLive=true}
    else log('board.bad_ip',{level:'warn',topic:t,payload:m})}
  else if(x=/^([^/]+)\/status$/.exec(t)){const b=dev(x[1]),to=m.trim().toLowerCase(),from=b.state;b.state=to;if(!stored)b.at=Date.now();if(from!==to)log('board.state',{id:b.id,from:from??null,to,stored,live:!stored})}
  else if(x=/^([^/]+)\/(manualmode|mcpplayenable)$/.exec(t)){const b=dev(x[1]);b[x[2]]=m.trim();if(!stored&&x[2]==='manualmode')b.manualAt=Date.now();log('board.diag',{id:x[1],what:x[2],value:m.trim()})}   // answers to Diagnose, shown on the board's card
  else if(x=/^([^/]+)\/(eventhandler|motors)$/.exec(t)){try{const b=dev(x[1]),d=b[x[2]]=JSON.parse(m);if(!stored&&x[2]==='motors')b.motorsAt=Date.now();
    log('board.diag',x[2]==='eventhandler'?{id:x[1],what:'eventhandler',state:d.state,active_event:d['active event'],last_event:d['last event'],network:d.network,overvoltage:d.overvoltage,undervoltage:d.undervoltage,motor:d.motor}:
      {id:x[1],what:'motors',types:d.config?.type?.join(','),status:d.info?.status?.join(','),speedrel:d.speedrel?.join(','),normspeed:d.config?.normspeed?.join(',')})}catch(e){log('board.bad_json',{level:'warn',topic:t,err:e.message})}}
  else if(x=/^([^/]+)\/motors\/(\d)\/info\/startstops$/.exec(t)){const b=dev(x[1]);(b.startstops||(b.startstops={}))[x[2]]=m.trim();log('board.diag',{id:x[1],what:'startstops',motor:x[2],value:m.trim()})}
  touch()}
let cn=0;   // number of the connection attempt, to follow one through the log
function hangup(){if(client){const c=client;client=null;log('mqtt.hangup',{conn:cn,by:'the app'});c.end(true)}setStatus('disconnected')}
const pktInfo=pk=>({cmd:pk.cmd,id:pk.messageId,...(pk.cmd==='connect'?{client_id:pk.clientId,keepalive:pk.keepalive,clean:pk.clean,user:!!pk.username}:pk.cmd==='connack'?{return_code:pk.returnCode,session_present:pk.sessionPresent}:
  pk.cmd==='subscribe'?{subs:(pk.subscriptions||[]).map(s=>s.topic+':'+s.qos).join(',')}:pk.cmd==='suback'?{granted:pk.granted}:pk.cmd==='disconnect'?{reason:pk.reasonCode}:{})});
function pub(topic,payload,opts,why,cb){   // every message the app sends goes through here, so it is in the log with the reason
  log('mqtt.out',{conn:cn,topic,payload:String(payload),qos:opts?.qos||0,retain:!!opts?.retain,why});
  client.publish(topic,payload,opts||{},e=>{if(e)log('mqtt.out_error',{level:'error',topic,err:e.message});cb&&cb(e)})}
function connect(){
  hangup();off=false;boards.clear();held.clear();sys={};denied=[];const c=db.conn;   // the list of messages stays: it is the story of what happened
  if(typeof mqtt==='undefined'){setStatus('error');log('mqtt.lib_missing',{level:'error'});return toast('MQTT library failed to load (check internet)')}
  setStatus('connecting');let cl;
  const url=c.protocol==='tcp'?`ws://${location.host}/tcp/${c.host}/${c.port}`:`${c.protocol==='wss'?'wss':'ws'}://${c.host}:${c.port}/${String(c.path||'mqtt').replace(/^\/+/,'')}`;
  const cid=rid(),me=++cn;let up=0,tries=0;
  log('mqtt.connect_try',{conn:me,url,client_id:cid,user:c.username||null,protocol:c.protocol,keepalive_s:60,reconnect_ms:3000,connect_timeout_ms:20000});
  try{cl=client=mqtt.connect(url,
    {clientId:cid,username:c.username||undefined,password:c.password||undefined,reconnectPeriod:3000,connectTimeout:20000,resubscribe:false})}
  catch(e){setStatus('error');log('mqtt.connect_throw',{conn:me,level:'error',err:e.message});return toast(e.message)}
  const ev=(e,d)=>log('mqtt.'+e,{conn:me,...(cl===client?{}:{stale:true}),...d});   // stale: an old connection that is still closing
  cl.on('connect',pk=>{up=Date.now();ev('connect',{session_present:pk?.sessionPresent,return_code:pk?.returnCode,attempt:++tries})})
    .on('reconnect',()=>ev('reconnect',{}))
    .on('offline',()=>ev('offline',{level:'warn'}))
    .on('close',()=>{ev('close',{level:up?'warn':'error',up_for_s:up?(Date.now()-up)/1000:null,was_connected:!!up});up=0})
    .on('end',()=>ev('end',{}))
    .on('disconnect',pk=>ev('disconnect',{reason:pk?.reasonCode}))
    .on('error',e=>ev('error',{level:'error',err:e?.message,code:e?.code}))
    .on('packetsend',pk=>{if(pk.cmd!=='publish')ev('pkt',{dir:'out',...pktInfo(pk)})})
    .on('packetreceive',pk=>{if(pk.cmd!=='publish')ev('pkt',{dir:'in',...pktInfo(pk)})});
  let opened=false,told=false;   // told: explain a failed attempt once, not on every 3s retry
  cl.on('connect',()=>{if(cl===client){opened=true;setStatus('connected');denied=[];
      SUBS.forEach(t=>cl.subscribe(t,(e,g)=>{log('mqtt.sub',{conn:me,filter:t,ok:!e,granted_qos:g?.[0]?.qos,err:e?.message,level:e?'warn':undefined});
        if(cl===client&&/^Subscribe error/.test(e?.message)){denied.push(t);touch()}}));   // one by one: for a refusal mqtt.js does not say which filter
      setTimeout(()=>{if(cl===client&&cl.connected)ask()},1500)}})   // the broker's stored messages are in by now: ask each board, only an answer proves it is there
    .on('message',(t,m,pk)=>cl===client&&onMsg(t,String(m),pk.retain,pk))
    .on('reconnect',()=>cl===client&&setStatus('connecting'))
    .on('close',()=>{if(cl!==client)return;setStatus('disconnected');
      if(!opened&&!told){told=true;toast(c.protocol==='tcp'?'Could not connect. Check the address and port, and that this PC can reach the broker.':/^(1883|8883)$/.test(String(c.port))?"Port 1883/8883 is plain MQTT (TCP), which browsers can't use. Use your broker's Websocket port.":'Could not connect. Check the address, the Websocket port and that the broker is reachable.')}})
    .on('error',e=>{if(cl===client){told=true;setStatus('error');toast(e.message)}})}
function send(p,payload){   // true when the message went out (a toggle button only flips when it did)
  const pl=String(payload),blocked=reason=>{log('ui.press_blocked',{level:'warn',name:p.name,topic:p.topic,payload:pl,reason});return false};
  log('ui.press',{name:p.name,id:p.id,topic:p.topic,payload:pl,qos:+p.qos||0,retain:!!p.retain,mode:p.toggle?'toggle':p.payloadRel?'hold':p.repeat?'repeat':'tap',connected:!!client?.connected});
  if(/\/command\/teachin$/.test(p.topic)&&!confirm('Teach-in deletes the IP configuration of the board (manual, 18.8.7), and the board may not come back. Send it anyway?'))return blocked('teach-in not confirmed');
  if(p.confirm&&!confirm((p.confirmMsg||'<payload>').replaceAll('<payload>',pl)))return blocked('confirmation dismissed');
  if(!client?.connected){toast('Not connected');return blocked('not connected')}
  const m=p.isJson&&p.jsonEnv&&pl!==''?p.jsonEnv.replaceAll('<payload>',pl):pl,keep=p.retain&&CMD.test(p.topic);
  pub(p.topic,m,{qos:+p.qos||0,retain:!!p.retain},'button '+p.name,e=>toast(e?'Error: '+e.message:`Sent ${p.topic} ← ${m}`+(keep&&m!==''?'  (RETAINED: the broker gives it to the board again every time it connects)':'')));
  if(keep){m===''?held.delete(p.topic):held.set(p.topic,m);touch()}
  return true}
// ---- turning the rollers ----
// With MCP PLAY on, a board ignores speed commands unless it is in manual mode (manual 13 and "speedrel"), so a spin sets manual mode and then the speed, and a stop sets speed 0 and then leaves manual mode.
// The speed is always the normal one (100 % of the normal speed of the motor), forward. Spaced out: a board has little MQTT capacity and must be in manual mode before the speed counts.
// Never retained: a kept speed would be handed to the board again every time it connects.
const NORMAL=100,ECHO=/\/get$|\/set$|\/command\//;   // ECHO: our own requests come back to us (we listen to "#"): they are not the board speaking
const byId=(a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}),isPos=t=>/position/i.test(t||'');   // "position": the lifting motor of a transfer, which must not get a speed
// the numbers (1 to 4) of the motors of a board that take a speed: not the unused ones, not a lifting motor. null while the board has not told its motors
const rollers=id=>{const T=boards.get(id)?.motors?.config?.type;return T?T.map((t,i)=>t&&!/^disabled$/i.test(t)&&!isPos(t)?i+1:0).filter(Boolean):null};
const posMotor=(id,motor)=>{const T=boards.get(id)?.motors?.config?.type||[];return(motor==='all'?[1,2,3,4]:[+motor]).find(n=>isPos(T[n-1]))||0};   // number of the first lifting motor among the ones asked for, or 0
const turning=b=>!!b.motorsAt&&!!b.motors?.speedrel?.some(x=>Math.abs(x)>=1);   // from an answer of the board in this session, never from what the broker remembers
// what to name in the speed topic: "all", one motor, or the list of rollers when the board also has a lifting motor
const spinTarget=(id,motor)=>motor!=='all'?+motor:posMotor(id,'all')?rollers(id):'all';
function spinMotors(id,target,speed,on,why,keepManual){   // gives the time (ms) at which the last message goes out
  const ms=[].concat(target),sp=n=>`${id}/motors/${n}/speedrel/set`,mm=`${id}/manualmode/set`,
    seq=on?[[mm,'true'],...ms.map(n=>[sp(n),String(speed)])]:[...ms.map(n=>[sp(n),'0']),...(keepManual?[]:[[mm,'false']])],
    at=i=>on?(i?600+(i-1)*300:0):(i<ms.length?i*300:(ms.length-1)*300+600);
  seq.forEach(([t,m],i)=>setTimeout(()=>client?.connected&&pub(t,m,{},why),at(i)));return at(seq.length-1)}
// what a board accepted, said on screen: about 2.6 s after a spin or a stop each board is asked for its manual mode and the speed of its motors. A newer press of the same board replaces the pending check, so an old one never reports on a state that has changed
const checks=new Map();
function verdict(it){const b=boards.get(it.id),sp=b?.motors?.speedrel,mm=b?.manualmode;
  if(!sp||mm==null||!(b.manualAt>=it.t0)||!(b.motorsAt>=it.t0))return{...it,answered:false};
  const mine=(it.target==='all'?[1,2,3,4]:[].concat(it.target)).map(n=>sp[n-1]),
    ok=it.on?mm==='true'&&mine.some(x=>Math.abs(x-NORMAL)<1):mine.every(x=>Math.abs(x)<1)&&(it.keep||mm==='false');
  return{...it,answered:true,ok,mm,sp}}
function checkSpin(items,step=120){
  items.forEach((it,k)=>{clearTimeout(checks.get(it.id)?.timer);
    checks.set(it.id,{item:it,timer:setTimeout(()=>{if(!client?.connected)return;it.t0=Date.now();pub(it.id+'/manualmode/get','',{},'check '+it.id);pub(it.id+'/motors/get','',{},'check '+it.id)},1300+k*step)})});
  setTimeout(()=>{if(!client?.connected)return;
    const R=items.filter(it=>checks.get(it.id)?.item===it&&it.t0).map(verdict);
    R.forEach(r=>log('board.check',r.answered?{level:r.ok?undefined:'warn',id:r.id,action:r.on?'spin':'stop',manual_mode:r.mm,speedrel:r.sp.join(','),ok:r.ok}:{level:'warn',id:r.id,action:r.on?'spin':'stop',answered:false}));
    if(R.length===1){const r=R[0];toast(!r.answered?`${r.id} did not answer: is the PC on the Wi-Fi of the boards, and is the board on?`:r.ok?`${r.id}: ${r.on?'turning':'stopped'} (manual mode ${r.mm}, speed ${r.sp.join(' / ')}%)`:`${r.id} did not do it: manual mode ${r.mm}, speed ${r.sp.join(' / ')}%`)}
    else if(R.length){const bad=R.filter(r=>!r.ok),on=R[0].on;toast(bad.length?`${R.length-bad.length} of ${R.length} boards ${on?'turning':'stopped'}. Not: ${bad.map(r=>r.id+(r.answered?'':' (no answer)')).join(', ')}`:`All ${R.length} boards ${on?'turning':'stopped'}`)}},1300+(items.length-1)*step+1300)}
// Turn or stop the rollers of one board at normal speed, and check what it accepted. true when the messages went out
function spin(id,on,motor,why,o={}){   // o.keep: a stop does not leave manual mode; o.check=false: the caller reports for several boards
  if(!client?.connected){toast('Not connected');return false}
  if(!rollers(id)){toast(`${id}: it has not told its motors yet. Press Refresh in the Status tab, then try again.`);return false}
  const pm=on&&motor!=='all'&&posMotor(id,motor);
  if(pm){toast(`${id}: motor ${pm} is a position motor (it lifts), not a roller, so no speed is sent.`);return false}
  const target=spinTarget(id,motor);
  if(![].concat(target).length){toast(`${id}: it has no roller motor to turn`);return false}
  spinMotors(id,target,NORMAL,on,why,o.keep);
  if(o.check!==false){checkSpin([{id,target,on,keep:o.keep}]);toast(on?`${id}: manual mode on, then the normal speed`:`${id}: speed 0${o.keep?'':', then manual mode off'}`)}
  return true}
// All rollers: every board that has told its motors gets the same, one after the other. It asks first when it turns them
function spinAll(on){
  if(!client?.connected)return toast('Not connected');
  const L=[...boards.values()].filter(b=>b.live&&rollers(b.id)?.length).sort(byId);
  if(!L.length)return toast('No board has told its motors yet. Press Refresh in the Status tab.');
  log('ui.press',{mode:'all_rollers',action:on?'spin':'stop',boards:L.map(b=>b.id).join(','),connected:true});
  if(on&&!confirm(`Spin all rollers? The rollers of ${L.length} boards (${L.map(b=>b.id).join(', ')}) will turn at normal speed until you press Stop all. Manual mode switches the zone logic of these boards off. Lifting motors are left alone.`)){log('ui.press_blocked',{level:'warn',name:'all rollers',reason:'confirmation dismissed'});return}
  const items=L.map((b,i)=>{setTimeout(()=>spin(b.id,on,'all','all rollers',{check:false}),i*150);return{id:b.id,target:spinTarget(b.id,'all'),on,keep:false}});
  checkSpin(items,150);toast(on?`Turning the rollers of ${L.length} boards…`:`Stopping the rollers of ${L.length} boards…`)}
// A button of your own that turns the rollers of a board (or one motor): press to turn, press again to stop. A stop leaves manual mode only when no other such button of the same board is still on
function motorPress(p,on){   // true when the messages went out
  const id=p.board,motor=p.motorNo||'all',what=on?`${id}: ${motor==='all'?'rollers':'motor '+motor} at normal speed`:`${id}: stop`;
  log('ui.press',{name:p.name,id:p.id,mode:'motor',board:id,motor,action:on?'spin':'stop',connected:!!client?.connected});
  if(!client?.connected){toast('Not connected');log('ui.press_blocked',{level:'warn',name:p.name,reason:'not connected'});return false}
  if(on&&p.confirm&&!confirm((p.confirmMsg||'<payload>').replaceAll('<payload>',what))){log('ui.press_blocked',{level:'warn',name:p.name,reason:'confirmation dismissed'});return false}   // a stop is never held back by a question
  const keep=!on&&db.panels.some(q=>q.id!==p.id&&isSpin(q)&&q.board===id&&tog.get(q.id));

  if(!ok)log('ui.press_blocked',{level:'warn',name:p.name,reason:'the board could not be told'});

// Start all boards: an empty message on network_broadcast/start starts every MultiControl (manual 12.2). A board then moves a motor only when it has a box to move, apart from a short move after a reset. It asks first and never retains
function startAll(p){   // true when the message went out
  const by=p?.name?'button '+p.name:'Start all';
  log('ui.press',{name:p?.name,id:p?.id,mode:'start_all',connected:!!client?.connected});
  if(!client?.connected){toast('Not connected');log('ui.press_blocked',{level:'warn',name:p?.name,reason:'not connected'});return false}
  if(!confirm('Start all boards? Every MultiControl on this broker gets the start command. It does not turn the rollers by itself: a board moves a motor only when it has a box to move (use Spin to turn a roller).')){log('ui.press_blocked',{level:'warn',name:p?.name,reason:'confirmation dismissed'});return false}

let fid=0;

  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},tabs('home'),!db.conn?h('div',{class:'empty'},h('p',{},'Connect to your MQTT broker first'),h('button',{class:'btn',onclick:()=>go({n:'conn'})},'Setup a connection'))
      :h('div',{},h('div',{id:'boardbtns'}),
        db.panels.length?h('div',{class:'sect'},'My buttons'):null,
        db.panels.length?h('div',{class:'panels'},visible().map((p,i,vis)=>card(p,i,vis)))
          :h('div',{},h('div',{class:'sect'},'My buttons'),h('small',{class:'help'},'Optional: a button of your own for any message. Every board already has its Spin and Stop above.'),h('div',{},h('button',{class:'btn sm gray',onclick:add},'Add a button')))),
      db.conn&&db.panels.length?h('button',{class:'btn fab','aria-label':'Add',onclick:add},'+'):null))},
status(){
  if(db.conn&&!client&&!off)connect();
  const chip=db.conn&&h('button',{id:'st',class:'st '+status,onclick:chipClick},status);
  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},tabs('status'),h('div',{id:'stbody'}),
      h('details',{class:'feed',id:'stored',hidden:true},h('summary',{id:'storedsum'}),h('pre',{id:'storedlist'})),
      h('details',{class:'feed'},h('summary',{},'Messages received'),h('pre',{id:'feed'}))))},
logs(){
  if(db.conn&&!client&&!off)connect();
  const chip=db.conn&&h('button',{id:'st',class:'st '+status,onclick:chipClick},status);
  return h('div',{},bar('MQTT Panel',{back:false,right:[chip,menu([{label:'Connection',fn:()=>go({n:'conn'})}])]}),
    h('main',{},tabs('logs'),
      h('small',{class:'help'},'Everything the app and the program do is written down here, in order, so Claude can read what happened. Add a note whenever you see something with your own eyes: it is stamped with the time.'),
      h('div',{class:'row2'},h('input',{id:'note',placeholder:'What did you see? e.g. roller stopped',onkeydown:e=>{if(e.key==='Enter')addNote()}}),h('button',{class:'btn sm',onclick:addNote},'Add note')),
      h('div',{class:'btns2 quick'},QUICK.map(q=>h('button',{class:'btn sm gray',onclick:()=>addNote(q)},q))),
      h('div',{class:'btns2'},h('button',{class:'btn',onclick:copyExport},'Copy for Claude'),h('button',{class:'btn gray',onclick:downloadExport},'Download')),
      h('small',{class:'help',id:'logfile'}),
      h('div',{class:'btns2'},h('button',{id:'lk',class:'btn sm',onclick:()=>{logAll=false;drawLog()}},'Key events'),h('button',{id:'la',class:'btn sm gray',onclick:()=>{logAll=true;drawLog()}},'Everything')),
      h('pre',{id:'logview',class:'logview'}),
      h('textarea',{id:'logbox',hidden:true,readonly:true,'aria-label':'Log text to copy'})))},
conn(){
  const v=db.conn?structuredClone(db.conn):defaults(CONN,{host:location.protocol==='http:'&&!BRIDGE?location.hostname:''});   // served by the broker's http_dir: same host
  return page(db.conn?'Edit Connection':'Add Connection',Form(CONN,v,{label:db.conn?'SAVE':'CREATE',cancel:()=>back(),save:x=>{db.conn=x;log('ui.form',{what:'connection',host:x.host,port:x.port,protocol:x.protocol,user:x.username||null,path:x.path});save();connect();back()}}))},
pick(){return page('Select panel type to add',Object.entries(PT).map(([k,t])=>h('div',{class:'pick',tabindex:0,role:'button',onclick:()=>go({n:'panel',type:k,pick:1})},h('b',{},t.label))))},
panel({pid,type,pick}){
  const ex=pid&&db.panels.find(p=>p.id===pid),t=PT[ex?ex.type:type],v=ex?structuredClone(ex):defaults(t.fields,{id:uid(),type});
  return page((ex?'Edit ':'Add ')+t.label,Form(t.fields,v,{label:ex?'SAVE':'CREATE',cancel:()=>{if(pick)stack.pop();back()},
    save:x=>{const i=db.panels.findIndex(p=>p.id===x.id);log('ui.form',{what:x.type,new:i<0,...panelInfo(x)});i<0?db.panels.push(x):db.panels[i]=x;save();if(pick)stack.pop();back()}}))}
};
function render(){log('ui.nav',{route:route.n,panel:route.pid,type:route.type});drawn.home=drawn.status='';$('#app').replaceChildren(views[route.n](route));window.scrollTo(0,0);if(route.n==='status')draw();if(route.n==='logs')drawLog();if(route.n==='home')drawHome()}
log('app.start',{ua:navigator.userAgent,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,screen:`${screen.width}x${screen.height}`,dpr:devicePixelRatio,online:navigator.onLine,
  net:navigator.connection?`${navigator.connection.effectiveType} rtt=${navigator.connection.rtt} down=${navigator.connection.downlink}`:null,bridge:BRIDGE,url:location.href,visible:document.visibilityState,
  storage:(()=>{try{return localStorage.length+' keys'}catch(e){return 'blocked: '+e.message}})()});
if(db.conn)log('app.config',{host:db.conn.host,port:db.conn.port,protocol:db.conn.protocol,user:db.conn.username||null,path:db.conn.path,has_password:!!db.conn.password});
db.panels.forEach(p=>log('app.panel',panelInfo(p)));
render();
</script>
