<style>

.brow .bact .btn{padding:7px 12px;font-size:12px}.chev{color:var(--sub);font-size:14px;transition:transform .15s;justify-self:end}details[open]>.bmain .chev{transform:rotate(90deg)}

.chip.good{background:var(--success);color:var(--ink);border-color:transparent}.chip.bad{background:var(--danger);color:#fff;border-color:transparent}.chip.live{background:var(--primary);color:var(--ink);border-color:transparent}.chip.warn{background:var(--warning);color:var(--ink);border-color:transparent}

.msp{font-size:13px;font-variant-numeric:tabular-nums}.sbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.sbar i{display:block;height:100%;background:var(--primary)}

.logview{font-size:12px}.ll{display:inline}.ll.w{color:var(--warning)}.ll.e{color:var(--danger);font-weight:600}.lt{color:var(--sub)}.lg{font-weight:700}
.g-ui{color:#59b4ff}.g-board{color:#3ddc84}.g-app{color:#c58bff}.g-sys{color:#ffa94d}.g-note{color:var(--primary)}.g-mqtt,.g-relay{color:var(--sub)}

<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
const uid=()=>Math.random().toString(36).slice(2,10);
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
let tt;const toast=m=>{log('ui.toast',{text:m});const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,Math.max(2500,m.length*70))};
const COL={primary:'#f2d740',secondary:'#3dc2ff',tertiary:'#5260ff',success:'#2dd36f',warning:'#ffc409',danger:'#eb445a',medium:'#92949c'};
const COLS=Object.keys(COL).map(k=>[k,k[0].toUpperCase()+k.slice(1)]);
const fill=c=>{const k=COL[c]?c:'primary';return `background:${COL[k]};color:${k==='primary'||k==='warning'?'#0c0e0f':'#fff'}`};   // white text is unreadable on the two yellows

/* ---------- storage (ponytail: password in plain localStorage; fine for personal use, encrypt if the device is shared) ---------- */
const KEY='mqtt-buttons-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db=db&&Array.isArray(db.panels)?db:{conn:null,panels:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){log('app.storage_error',{level:'error',err:e.message});toast('Could not save (storage blocked)')}};

/* ---------- log: everything that happens, one line each, to be read by a person or by an assistant. The Windows program keeps the same lines in a file (mqtt-panel.log) ---------- */
// line: <local time> T+<seconds since the program started> <tag.event> key=value ...   (the same format the program writes, so both sort into one story)
const LOG=[],OUT=[],T0=Date.now(),SAFE=/^[\w.:/+#$@<>-]+$/;let progStart=null,INFO=null,sink=true,logAll=false;
const pad=(n,w=2)=>String(n).padStart(w,'0'),
  stamp=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}`},
  val=v=>{if(v==null)return 'null';if(typeof v==='object')v=JSON.stringify(v);if(typeof v!=='string')return String(v);const r=[...v];
    return r.length>300?JSON.stringify(r.slice(0,300).join('')+`…(+${r.length-300})`):v!==''&&SAFE.test(v)?v:JSON.stringify(v)},
  fmt=e=>`${stamp(e.t)} T+${((e.t-(progStart??T0))/1000).toFixed(3)} ${e.tag}${Object.entries(e.d||{}).filter(([,v])=>v!==undefined).map(([k,v])=>` ${k}=${val(v)}`).join('')}`;
function log(tag,d){const e={t:Date.now(),tag,d};LOG.push(e);OUT.push(e);if(LOG.length>20000)LOG.splice(0,2000);if(OUT.length>20000)OUT.splice(0,2000);return e}
function flush(beacon){   // sends what is new to the program, which writes it in the file
